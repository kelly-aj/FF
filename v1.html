<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>LFF Task - Version 1 (with embedded squared task)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" href="jspsych/jspsych.css" />
  <!-- NOTE: squared.css is loaded dynamically only while the squared task runs. Removed global include to avoid style collisions. -->

  <script src="jspsych/jspsych.js"></script>

  <!-- Plugins required by the page and squared tasks -->
  <script src="jspsych/plugin-fullscreen.js"></script>
  <script src="jspsych/plugin-survey-text.js"></script>
  <script src="jspsych/plugin-survey-multi-choice.js"></script>

  <script src="jspsych/plugin-preload.js"></script>
  <script src="jspsych/plugin-html-keyboard-response.js"></script>
  <script src="jspsych/plugin-html-button-response.js"></script>

  <style>
    body { background:#fafafa; font-family: Arial, sans-serif; color:#111; }
    .centered { max-width:900px; margin:0 auto; padding:24px; line-height:1.45; }
    .question-title { font-size:22px; font-weight:600; margin-bottom:16px; }

    .image-choice-container {
      display:flex;
      justify-content:center;
      gap:40px;
      flex-wrap:wrap;
      margin-top:18px;
    }

    .choice-img {
      max-width:360px;
      max-height:320px;
      border:2px solid #ddd;
      border-radius:6px;
    }

    .vertical-btn {
      display:block;
      width:700px;
      max-width:90%;
      margin:10px auto;
      text-align:left;
      padding:12px;
    }

    .incorrect-banner {
      font-size:30px;
      font-weight:700;
      color:#b00020;
      text-align:center;
      margin:16px 0 24px;
    }

    /* Feedback banner: positive/green */
    .feedback-banner {
      font-size:30px;
      font-weight:700;
      color:#006400; /* darkgreen */
      text-align:center;
      margin:16px 0 24px;
    }

    .press-space { text-align:center; margin-top:24px; }

    .break-box {
      display:flex;
      gap:24px;
      align-items:flex-start;
      justify-content:space-between;
      flex-wrap:wrap;
      margin-top:10px;
    }

    textarea#music,
    textarea#writing {
      width:100%;
      min-height:160px;
      font-size:16px;
      padding:12px;
      border:2px solid #ccc;
      border-radius:6px;
      resize:vertical;
    }

    .countdown {
      flex:0 0 220px;
      font-size:18px;
      border:2px solid #ccc;
      border-radius:6px;
      padding:12px;
      height:56px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#fff;
    }
  </style>
</head>

<body>
<!-- make the container focusable so keyboard trials reliably receive keypresses -->
<div id="jspsych-target" tabindex="0"></div>

<script>
// Global error handlers to surface silent issues
window.addEventListener('error', e => {
  console.error('GLOBAL ERROR:', e.message, e.filename + ':' + e.lineno);
});
window.addEventListener('unhandledrejection', e => {
  console.error('UNHANDLED PROMISE REJECTION:', e.reason);
});

console.log('Starting experiment script...');

/**************** CONFIG ****************/
const VERSION = "v1";
const ROUND2_CORRECT_RULE = "same";
const BREAK_SECONDS = 120;
const QUALTRICS_RETURN_URL = "https://merceruniversity.co1.qualtrics.com/jfe/form/SV_eEG4o0S1x2n2DFI";

/**************** INIT ****************/
// Expose the instance globally so you can inspect/run it from DevTools
window.jsPsych = initJsPsych({ display_element: 'jspsych-target' });
window._jsPsychInstance = window.jsPsych;

jsPsych.data.addProperties({ version: VERSION });

/**************** DYNAMIC CSS HELPERS ****************/
function loadCSS(href){
  const link = document.createElement('link');
  link.rel = 'stylesheet';
  link.href = href;
  document.head.appendChild(link);
  return link;
}
function unloadCSS(link){
  if(link && link.parentNode){ link.parentNode.removeChild(link); }
}

/**************** PAYLOAD BUILDER ****************/
function buildSummaryPayload() {
  const all = jsPsych.data.get().values();

  const r1 = all.filter(d => d.round === 1);
  const r2 = all.filter(d => d.round === 2);
  const r3 = all.filter(d => d.round === 3);
  const r4 = all.filter(d => d.round === 4);

  const r1_choices = r1.map(d => d.choice_label || '').join(',');
  const r2_choices = r2.map(d => d.choice_label || '').join(',');
  const r3_choices = r3.map(d => d.choice_label || '').join(',');
  const r4_choices = r4.map(d => d.choice_label || '').join(',');

  const r2_correct_arr = r2.map(d => Number(d.correct || 0));
  const r2_correct = r2_correct_arr.join(',');
  const r2_total = r2_correct_arr.reduce((a, b) => a + b, 0);

  const r3_correct_arr = r3.map(d => Number(d.correct || 0));
  const r3_correct = r3_correct_arr.join(',');
  const r3_total = r3_correct_arr.reduce((a,b)=>a+b,0);

  const r4_correct_arr = r4.map(d => Number(d.correct || 0));
  const r4_correct = r4_correct_arr.join(',');
  const r4_total = r4_correct_arr.reduce((a,b)=>a+b,0);

  const rt_r1 = r1.map(d => d.rt || '').join(',');
  const rt_r2 = r2.map(d => d.rt || '').join(',');
  const rt_r3 = r3.map(d => d.rt || '').join(',');
  const rt_r4 = r4.map(d => d.rt || '').join(',');

  function getTaskSummary(taskName) {
    try {
      const mainFilter = jsPsych.data.get().filter({ task: taskName, practice: 0, timeout: 0 });
      const lastRow = mainFilter.last(1).values()[0] || {};
      return {
        score_final: lastRow.score_final || '',
        meanrt_final: mainFilter.select('rt').mean() || ''
      };
    } catch (e) {
      return { score_final:'', meanrt_final: '' };
    }
  }

  const stroopSummary = getTaskSummary('stroop');
  const flankerSummary = getTaskSummary('flanker');
  const simonSummary = getTaskSummary('simon');

  const breakRow = all.find(d => d.favorite_music !== undefined);
  const music = breakRow ? breakRow.favorite_music : "";
  const music_short = music.length > 150 ? music.slice(0, 150) : music;

  const break2Row = all.find(d => d.favorite_writing !== undefined);
  const writing = break2Row ? break2Row.favorite_writing : "";
  const writing_short = writing.length > 150 ? writing.slice(0, 150) : writing;

  const readingRow = all.find(d => d.reading_time !== undefined);
  const reading_time = readingRow ? readingRow.reading_time : '';

  return {
    r1_choices,
    r2_choices,
    r3_choices,
    r4_choices,
    r2_correct,
    r2_total: String(r2_total),
    r3_correct,
    r3_total: String(r3_total),
    r4_correct,
    r4_total: String(r4_total),
    rt_r1,
    rt_r2,
    rt_r3,
    rt_r4,
    music_short,
    writing_short,
    reading_time,
    stroop_score: String(stroopSummary.score_final || ''),
    stroop_meanrt: String(stroopSummary.meanrt_final || ''),
    flanker_score: String(flankerSummary.score_final || ''),
    flanker_meanrt: String(flankerSummary.meanrt_final || ''),
    simon_score: String(simonSummary.score_final || ''),
    simon_meanrt: String(simonSummary.meanrt_final || '')
  };
}

/**************** DATA & HELPERS ****************/
const round1Questions = [

const round2Questions = [

const round1Choices = [null,null,null,null];
const round3Choices = [null,null,null,null];

function imgChoice(src, alt) {

/**************** ROUNDS UI ****************/
const intro1 = {
  type: jsPsychHtmlKeyboardResponse,
  stimulus: `
  <div class="centered">
    <p>Welcome! Today you will answer some language questions about a researcher-manufactured ancient script.</p>
    <p>Whether you get the answers right or wrong in Round 1, try to learn. Round 2 will test how much you learned.</p>
    <p style="text-align:center;"><strong>Press space to continue.</strong></p>
  </div>`,
  choices: [' ']
};

const intro2 = {
  type: jsPsychHtmlKeyboardResponse,
  stimulus: `
  <div class="centered">
    <p>People often assume they naturally learn from their mistakes, but research shows this process is more difficult and less automatic than it seems.</p>
    <p style="text-align:center;"><strong>Press space to begin Round 1.</strong></p>
  </div>`,
  choices: [' '],

};

function makeRound1Trial(i){

    type: jsPsychHtmlButtonResponse,

const incorrectFeedback = {
  type: jsPsychHtmlKeyboardResponse,
  stimulus: `
  <div class="centered">
    <div class="incorrect-banner">YOU ANSWERED THIS QUESTION INCORRECT!</div>
    <div class="press-space">Press space to continue.</div>
  </div>`,
  choices:[' ']
};

let breakIntervalId=null;

const breakScreen = {
  type: jsPsychHtmlButtonResponse,
  stimulus: `
  <div class="centered">
    <p>Thanks for answering those initial questions. Right now, take a short breather.</p>
    <p><strong>Tell us: what is your favorite music to listen to?</strong></p>
    <p>Please take two minutes and write your answer in the textbox below.</p>

    <div class="break-box">
      <div style="flex:1;">
        <textarea id="music" placeholder="Type your answer here..."></textarea>
      </div>
      <div class="countdown" id="countdown">2:00</div>
    </div>
  </div>
  `,
  choices: ['Submit'],
  button_html: '<button class="jspsych-btn" type="button" disabled>%choice%</button>',
  on_load: function(){
    const btn = document.querySelector('.jspsych-html-button-response-button button');
    const el = document.getElementById('countdown');
    let total = BREAK_SECONDS;
    function formatTime(s){ return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; }
    el.textContent = formatTime(total);
    breakIntervalId = setInterval(()=>{
      total--;

const round2Intro = {
  type: jsPsychHtmlKeyboardResponse,
  stimulus: `
  <div class="centered">
    <p><strong>This is Round 2.</strong></p>
    <p>Based on what you learned about the researcher-manufactured ancient script in Round 1, answer the next four questions by selecting the appropriate image.</p>
    <p style="text-align:center;"><strong>Press space bar to begin answering the questions.</strong></p>
  </div>`,
  choices:[' ']
};

function makeRound2Trial(i){
  const pair = imagePairs[i];
  return {
    type: jsPsychHtmlButtonResponse,
    stimulus: `<div class="centered"><div class="question-title">${round2Questions[i]}</div></div>`,
    choices: [imgChoice(pair.A,"A"), imgChoice(pair.B,"B")],
    data: { round: 2 },
    on_finish: function(d){
      const choiceLabel = (d.response === 0) ? "A" : "B";
      const r1Choice = round1Choices[i];
      const correct = (ROUND2_CORRECT_RULE === 'different') ? (choiceLabel !== r1Choice) : (choiceLabel === r1Choice);
      d.choice_label = choiceLabel;
      d.chosen_image = (d.response === 0) ? pair.A : pair.B;
      d.round1_choice_for_pair = r1Choice;
      d.correct = correct ? 1 : 0;
    }
  };
}

const round3Intro = {
  type: jsPsychHtmlKeyboardResponse,
  stimulus: `
  <div class="centered">
    <p><strong>This is Round 3.</strong></p>
    <p>This round uses a different set of images and will be scored separately. When you are ready, press space to begin.</p>
    <p style="text-align:center;"><strong>Press space to begin Round 3.</strong></p>
  </div>`,
  choices:[' ']
};

function makeRound3Trial(i){
  const pair = imagePairsRound3[i];
  return {
    type: jsPsychHtmlButtonResponse,
    stimulus: `<div class="centered"><div class="question-title">${round3Questions[i]}</div></div>`,
    choices: [imgChoice(pair.A,"A"), imgChoice(pair.B,"B")],
    data: { round: 3 },
    on_finish: function(d){
      const c = (d.response===0) ? "A" : "B";
      d.choice_label = c;
      d.chosen_image = (d.response === 0) ? pair.A : pair.B;
      round3Choices[i] = c;
      const key = round3Answers[i];

        d.correct = (c === key) ? 1 : 0;

const positiveFeedback = {

    <div class="feedback-banner">YOU ANSWERED THIS QUESTION CORRECT!</div>
    <div class="press-space">Press space to continue.</div>

  choices:[' ']
};

let break2IntervalId = null;

const break2Screen = {

  stimulus: `
  <div class="centered">
    <p>Thanks — before the final recall round, please take a short writing break.</p>

    <div class="break-box">
      <div style="flex:1;">
        <textarea id="writing" placeholder="Type your answer here..."></textarea>
      </div>
      <div class="countdown" id="countdown2">2:00</div>
    </div>
  </div>
  `,
  choices: ['Submit'],
  button_html: '<button class="jspsych-btn" type="button" disabled>%choice%</button>',

    el.textContent = formatTime(total);
    break2IntervalId = setInterval(()=>{
      total--;
      el.textContent = formatTime(Math.max(total,0));

const round4Intro = {

  stimulus: `
  <div class="centered">

/**************** SQUARED TASK (embedded full tasks) ****************/
function getSquaredTimeline() {
  // Local scope for squared tasks
  const practice_duration = 30000;
  const main_duration = 90000;

  function countdown_local(start, timelimit) {
    const timeleft_bar = document.getElementById("timeleft");
    if (!timeleft_bar) return;
    let timeleft_width = (timelimit - (Date.now() - start)) * 100 / timelimit;
    function shorten_timebar() {
      if (timeleft_width <= 0) {
        clearInterval(update_timeleft);
      } else {
        timeleft_width -= 10 * 100 / timelimit;
        timeleft_bar.style.width = timeleft_width + "%";
      }
    }
    const update_timeleft = setInterval(shorten_timebar, 10);
  }

  const al = "squared/al.PNG";
  const ar = "squared/ar.PNG";
  const mr_fl = "squared/mr_fl.PNG";
  const ml_fr = "squared/ml_fr.PNG";
  const rarr = "squared/rarr.PNG";
  const larr = "squared/larr.PNG";

  // STROOP
  const stimuli_stroop = [
    {stim: "RED", stimcolor: "#ff0302", resp1: "BLUE", resp1color: "#0000FF", resp2: "RED", resp2color: "#ff0302", correct_response: 1, condition: 1},
    {stim: "RED", stimcolor: "#ff0302", resp1: "RED", resp1color: "#ff0302", resp2: "BLUE", resp2color: "#0000FF", correct_response: 0, condition: 1},
    {stim: "BLUE", stimcolor: "#0000FF", resp1: "BLUE", resp1color: "#0000FF", resp2: "RED", resp2color: "#ff0302", correct_response: 0, condition: 1},
    {stim: "BLUE", stimcolor: "#0000FF", resp1: "RED", resp1color: "#ff0302", resp2: "BLUE", resp2color: "#0000FF", correct_response: 1, condition: 1},
    {stim: "RED", stimcolor: "#ff0302", resp1: "RED", resp1color: "#0000FF", resp2: "BLUE", resp2color: "#ff0302", correct_response: 0, condition: 2},
    {stim: "RED", stimcolor: "#ff0302", resp1: "BLUE", resp1color: "#ff0302", resp2: "RED", resp2color: "#0000FF", correct_response: 1, condition: 2},
    {stim: "BLUE", stimcolor: "#0000FF", resp1: "RED", resp1color: "#0000FF", resp2: "BLUE", resp2color: "#ff0302", correct_response: 1, condition: 2},
    {stim: "BLUE", stimcolor: "#0000FF", resp1: "BLUE", resp1color: "#ff0302", resp2: "RED", resp2color: "#0000FF", correct_response: 0, condition: 2},
    {stim: "RED", stimcolor: "#0000FF", resp1: "BLUE", resp1color: "#0000FF", resp2: "RED", resp2color: "#ff0302", correct_response: 0, condition: 3},
    {stim: "RED", stimcolor: "#0000FF", resp1: "RED", resp1color: "#ff0302", resp2: "BLUE", resp2color: "#0000FF", correct_response: 1, condition: 3},
    {stim: "BLUE", stimcolor: "#ff0302", resp1: "BLUE", resp1color: "#0000FF", resp2: "RED", resp2color: "#ff0302", correct_response: 1, condition: 3},
    {stim: "BLUE", stimcolor: "#ff0302", resp1: "RED", resp1color: "#ff0302", resp2: "BLUE", resp2color: "#0000FF", correct_response: 0, condition: 3},
    {stim: "RED", stimcolor: "#0000FF", resp1: "RED", resp1color: "#0000FF", resp2: "BLUE", resp2color: "#ff0302", correct_response: 1, condition: 4},
    {stim: "RED", stimcolor: "#0000FF", resp1: "BLUE", resp1color: "#ff0302", resp2: "RED", resp2color: "#0000FF", correct_response: 0, condition: 4},
    {stim: "BLUE", stimcolor: "#ff0302", resp1: "RED", resp1color: "#0000FF", resp2: "BLUE", resp2color: "#ff0302", correct_response: 0, condition: 4},
    {stim: "BLUE", stimcolor: "#ff0302", resp1: "BLUE", resp1color: "#ff0302", resp2: "RED", resp2color: "#0000FF", correct_response: 1, condition: 4}
  ];

  const items_stroop = Array.from(Array(16).keys());
  const practice_stroop = jsPsych.randomization.sampleWithReplacement(items_stroop, 100);
  const main_stroop = jsPsych.randomization.sampleWithReplacement(items_stroop, 500);

  function display_stroop(stimulusIndex) {
    const stim = stimuli_stroop[stimulusIndex].stim;
    const stimcolor = stimuli_stroop[stimulusIndex].stimcolor;
    return "<div style='font-size: 10pt; display:flex; align-items:center;'>Time left<div id='countdownbar' style='margin:0 12px;'><div id='timeleft'></div></div><span style='font-size:54pt; font-weight:900; color:" + stimcolor + ";'>" + stim + "</span></div>";
  }

  <style>
    body { background:#fafafa; font-family: Arial, sans-serif; color:#111; }
    .centered { max-width:900px; margin:0 auto; padding:24px; line-height:1.45; }
    .question-title { font-size:22px; font-weight:600; margin-bottom:16px; }

    iframe.squared-frame { width:100%; height:760px; border:0; }

<body>
  <div id="jspsych-target" tabindex="0"></div>

<script>
/* Global error handlers */
window.addEventListener('error', e => console.error('GLOBAL ERROR:', e.message, e.filename + ':' + e.lineno));
window.addEventListener('unhandledrejection', e => console.error('UNHANDLED PROMISE REJECTION:', e.reason));

console.log('Starting experiment script...');

/**************** CONFIG ****************/
const VERSION = "v1";
const ROUND2_CORRECT_RULE = "same";
const BREAK_SECONDS = 120;
const QUALTRICS_RETURN_URL = "https://merceruniversity.co1.qualtrics.com/jfe/form/SV_eEG4o0S1x2n2DFI";

/**************** INIT ****************/
window.jsPsych = initJsPsych({ display_element: 'jspsych-target' });
window._jsPsychInstance = window.jsPsych;
jsPsych.data.addProperties({ version: VERSION });

/**************** PAYLOAD BUILDER (same as before) ****************/
function buildSummaryPayload() {
  const all = jsPsych.data.get().values();

  const r1 = all.filter(d => d.round === 1);
  const r2 = all.filter(d => d.round === 2);
  const r3 = all.filter(d => d.round === 3);
  const r4 = all.filter(d => d.round === 4);

  const r1_choices = r1.map(d => d.choice_label || '').join(',');
  const r2_choices = r2.map(d => d.choice_label || '').join(',');
  const r3_choices = r3.map(d => d.choice_label || '').join(',');
  const r4_choices = r4.map(d => d.choice_label || '').join(',');

  const r2_correct_arr = r2.map(d => Number(d.correct || 0));
  const r2_total = r2_correct_arr.reduce((a, b) => a + b, 0);

  const r3_correct_arr = r3.map(d => Number(d.correct || 0));
  const r3_total = r3_correct_arr.reduce((a,b)=>a+b,0);

  const r4_correct_arr = r4.map(d => Number(d.correct || 0));
  const r4_total = r4_correct_arr.reduce((a,b)=>a+b,0);

  const rt_r1 = r1.map(d => d.rt || '').join(',');
  const rt_r2 = r2.map(d => d.rt || '').join(',');
  const rt_r3 = r3.map(d => d.rt || '').join(',');
  const rt_r4 = r4.map(d => d.rt || '').join(',');

  function getTaskSummary(taskName) {
    try {
      const mainFilter = jsPsych.data.get().filter({ task: taskName, practice: 0, timeout: 0 });
      const lastRow = mainFilter.last(1).values()[0] || {};
      return {
        score_final: lastRow.score_final || '',
        meanrt_final: mainFilter.select('rt').mean() || ''
      };
    } catch (e) {
      return { score_final:'', meanrt_final: '' };
    }
  }

  const stroopSummary = getTaskSummary('stroop');
  const flankerSummary = getTaskSummary('flanker');
  const simonSummary = getTaskSummary('simon');

  const breakRow = all.find(d => d.favorite_music !== undefined);
  const music_short = breakRow ? (breakRow.favorite_music || '').slice(0,150) : '';
  const break2Row = all.find(d => d.favorite_writing !== undefined);
  const writing_short = break2Row ? (break2Row.favorite_writing || '').slice(0,150) : '';
  const readingRow = all.find(d => d.reading_time !== undefined);
  const reading_time = readingRow ? readingRow.reading_time : '';

  return {
    r1_choices, r2_choices, r3_choices, r4_choices,
    r2_correct: r2.map(d => d.correct || 0).join(','), r2_total: String(r2_total),
    r3_correct: r3.map(d => d.correct || 0).join(','), r3_total: String(r3_total),
    r4_correct: r4.map(d => d.correct || 0).join(','), r4_total: String(r4_total),
    rt_r1, rt_r2, rt_r3, rt_r4,
    music_short, writing_short, reading_time,
    stroop_score: String(stroopSummary.score_final || ''), stroop_meanrt: String(stroopSummary.meanrt_final || ''),
    flanker_score: String(flankerSummary.score_final || ''), flanker_meanrt: String(flankerSummary.meanrt_final || ''),
    simon_score: String(simonSummary.score_final || ''), simon_meanrt: String(simonSummary.meanrt_final || '')
  };
}

/**************** CORE ROUNDS (unchanged) ****************/

<script>
/**************** IFRAME-BASED SQUARED TRIAL ****************/
function getSquaredTimeline() {
  const trial = {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: `<div class="centered" style="padding:0;"><iframe id="squared-iframe" class="squared-frame" src="squared/squared.html" title="Squared task"></iframe></div>`,
    choices: "NO_KEYS",
    trial_duration: null, // will finish when we get message from iframe
    on_start: function() {
      console.log('DEBUG: squared iframe trial started; waiting for postMessage from iframe');

      function onMessage(e) {
        // For local testing accept same-origin; in prod check e.origin against your site origin
        try {
          if (e.origin !== window.location.origin) {
            console.warn('Message from unexpected origin:', e.origin);
            // allow local wildcard during development; comment out the next line if you need to accept cross-origin
            // return;
          }
        } catch (err) {
          console.warn('Origin check failed (running locally?), continuing', err);
        }

        const msg = e.data;
        if (!msg || msg.type !== 'squared_done') return;
        console.log('DEBUG: received squared_done message from iframe', msg);

        // Attach the squared summaries to this trial's data and finish the trial
        const payload = {
          task: 'squared',
          stroop_summary: msg.stroopSummary || {},
          flanker_summary: msg.flankerSummary || {},
          simon_summary: msg.simonSummary || {},
          raw: msg.raw || null
        };

        // finish the trial and record payload
        jsPsych.finishTrial(payload);

        // cleanup
        window.removeEventListener('message', onMessage);
      }

      window.addEventListener('message', onMessage, false);

      // attempt to focus iframe so internal keyboard handlers work
      setTimeout(function(){
        const iframe = document.getElementById('squared-iframe');
        try { iframe && iframe.contentWindow && iframe.contentWindow.focus(); } catch(e) { /* may be blocked cross-origin */ }
      }, 200);
    }
  };

  return [trial];
}

/**************** BUILD TIMELINE & RUN ****************/
/* Reconstruct timeline: use your existing timeline code but
   insert the getSquaredTimeline() result where you previously had the embedded squared code. */

/* Example high-level timeline construction (replace with your real definitions) */
const timeline = [];

/* Example / placeholder: push intros then R1..R2 then squared iframe then R3..R4 then final */
/* Make sure you paste the actual trials definitions (intro1, intro2, makeRound1Trial, etc.)
   from your previous file in the top <script> area so the lines below reference them. */

if (typeof intro1 !== 'undefined') timeline.push(intro1);
if (typeof intro2 !== 'undefined') timeline.push(intro2);

/* push Round1 trials if defined */
if (typeof makeRound1Trial === 'function') {
  for (let i=0;i<4;i++){
    timeline.push(makeRound1Trial(i));
    if (typeof incorrectFeedback !== 'undefined') timeline.push(incorrectFeedback);
  }
}

/* break and round2 */
if (typeof breakScreen !== 'undefined') timeline.push(breakScreen);
if (typeof round2Intro !== 'undefined') timeline.push(round2Intro);
if (typeof makeRound2Trial === 'function') {
  for (let i=0;i<4;i++) timeline.push(makeRound2Trial(i));
}

/* Insert the iframe-based squared timeline */
timeline.push(...getSquaredTimeline());

/* Round 3 and after (if definitions exist) */
if (typeof round3Intro !== 'undefined') timeline.push(round3Intro);
if (typeof makeRound3Trial === 'function') {
  for (let i=0;i<4;i++){
    timeline.push(makeRound3Trial(i));
    if (typeof positiveFeedback !== 'undefined') timeline.push(positiveFeedback);
  }
}
if (typeof break2Screen !== 'undefined') timeline.push(break2Screen);
if (typeof round4Intro !== 'undefined') timeline.push(round4Intro);
if (typeof makeRound4Trial === 'function') {
  for (let i=0;i<4;i++) timeline.push(makeRound4Trial(i));
}
if (typeof finalScreen !== 'undefined') timeline.push(finalScreen);

/* Debug trial at the start (optional): */
const debugTrial = {
  type: jsPsychHtmlButtonResponse,
  stimulus: `<div class="centered"><p style="font-size:20px;"><strong>DEBUG: jsPsych started</strong></p><p>If you see this, jsPsych is running.</p><p>Click Continue.</p></div>`,
  choices: ['Continue'],
  on_start: function(){ const t = document.getElementById('jspsych-target'); if (t && t.focus) { t.focus(); console.log('DEBUG: focused jspsych-target'); } },
  on_finish: function(){ console.log('DEBUG: debugTrial finished'); }
};
timeline.unshift(debugTrial);

console.log('DEBUG: running timeline (parent index.html)');
jsPsych.run(timeline);
</script>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>LFF Task - Version 1 (with embedded squared task)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" href="jspsych/jspsych.css" />
  <!-- squared.css will be injected dynamically to avoid style collisions -->

  <script src="jspsych/jspsych.js"></script>

  <!-- Required plugins -->
  <script src="jspsych/plugin-fullscreen.js"></script>
  <script src="jspsych/plugin-survey-text.js"></script>
  <script src="jspsych/plugin-survey-multi-choice.js"></script>

  <script src="jspsych/plugin-preload.js"></script>

  <style>
    body { background:#fafafa; font-family: Arial, sans-serif; color:#111; }
    .centered { max-width:900px; margin:0 auto; padding:24px; line-height:1.45; }
    .question-title { font-size:22px; font-weight:600; margin-bottom:16px; }
    .choice-img { max-width:360px; max-height:320px; border:2px solid #ddd; border-radius:6px; }
    .incorrect-banner { font-size:30px; font-weight:700; color:#b00020; text-align:center; margin:16px 0 24px; }

  </style>
</head>

<body>
<div id="jspsych-target" tabindex="0"></div>

<script>
// Global error handlers
window.addEventListener('error', e => console.error('GLOBAL ERROR:', e.message, e.filename + ':' + e.lineno));
window.addEventListener('unhandledrejection', e => console.error('UNHANDLED PROMISE REJECTION:', e.reason));

console.log('Starting experiment script...');

/**************** CONFIG ****************/
const VERSION = "v1";
const ROUND2_CORRECT_RULE = "same";
const BREAK_SECONDS = 120;
const QUALTRICS_RETURN_URL = "https://merceruniversity.co1.qualtrics.com/jfe/form/SV_eEG4o0S1x2n2DFI";

/**************** INIT ****************/
window.jsPsych = initJsPsych({ display_element: 'jspsych-target' });
window._jsPsychInstance = window.jsPsych;
jsPsych.data.addProperties({ version: VERSION });

/**************** DYNAMIC CSS HELPERS ****************/
function loadCSS(href){
  const link = document.createElement('link');
  link.rel = 'stylesheet';
  link.href = href;
  document.head.appendChild(link);
  return link;
}
function unloadCSS(link){
  if(link && link.parentNode) link.parentNode.removeChild(link);
}

/**************** PAYLOAD BUILDER ****************/
function buildSummaryPayload() {
  const all = jsPsych.data.get().values();
  const r1 = all.filter(d => d.round === 1);
  const r2 = all.filter(d => d.round === 2);
  const r3 = all.filter(d => d.round === 3);
  const r4 = all.filter(d => d.round === 4);

  const r1_choices = r1.map(d => d.choice_label || '').join(',');
  const r2_choices = r2.map(d => d.choice_label || '').join(',');
  const r3_choices = r3.map(d => d.choice_label || '').join(',');
  const r4_choices = r4.map(d => d.choice_label || '').join(',');

  const r2_correct_arr = r2.map(d => Number(d.correct || 0));
  const r2_correct = r2_correct_arr.join(',');
  const r2_total = r2_correct_arr.reduce((a,b)=>a+b,0);

  const r3_correct_arr = r3.map(d => Number(d.correct || 0));
  const r3_correct = r3_correct_arr.join(',');
  const r3_total = r3_correct_arr.reduce((a,b)=>a+b,0);

  const r4_correct_arr = r4.map(d => Number(d.correct || 0));
  const r4_correct = r4_correct_arr.join(',');
  const r4_total = r4_correct_arr.reduce((a,b)=>a+b,0);

  const rt_r1 = r1.map(d => d.rt || '').join(',');
  const rt_r2 = r2.map(d => d.rt || '').join(',');
  const rt_r3 = r3.map(d => d.rt || '').join(',');
  const rt_r4 = r4.map(d => d.rt || '').join(',');

  function getTaskSummary(taskName) {
    try {
      const mainFilter = jsPsych.data.get().filter({ task: taskName, practice: 0, timeout: 0 });
      const lastRow = mainFilter.last(1).values()[0] || {};
      return { score_final: lastRow.score_final || '', meanrt_final: mainFilter.select('rt').mean() || '' };
    } catch (e) { return { score_final:'', meanrt_final: '' }; }
  }

  const stroopSummary = getTaskSummary('stroop');
  const flankerSummary = getTaskSummary('flanker');
  const simonSummary = getTaskSummary('simon');

  const breakRow = all.find(d => d.favorite_music !== undefined);
  const music = breakRow ? breakRow.favorite_music : "";
  const music_short = music.length > 150 ? music.slice(0,150) : music;
  const break2Row = all.find(d => d.favorite_writing !== undefined);
  const writing = break2Row ? break2Row.favorite_writing : "";
  const writing_short = writing.length > 150 ? writing.slice(0,150) : writing;
  const readingRow = all.find(d => d.reading_time !== undefined);
  const reading_time = readingRow ? readingRow.reading_time : '';

  return {
    r1_choices, r2_choices, r3_choices, r4_choices,
    r2_correct, r2_total: String(r2_total),
    r3_correct, r3_total: String(r3_total),
    r4_correct, r4_total: String(r4_total),
    rt_r1, rt_r2, rt_r3, rt_r4,
    music_short, writing_short, reading_time,
    stroop_score: String(stroopSummary.score_final || ''),
    stroop_meanrt: String(stroopSummary.meanrt_final || ''),
    flanker_score: String(flankerSummary.score_final || ''),
    flanker_meanrt: String(flankerSummary.meanrt_final || ''),
    simon_score: String(simonSummary.score_final || ''),
    simon_meanrt: String(simonSummary.meanrt_final || '')
  };
}

/**************** DATA & HELPERS ****************/
const round1Questions = [
  { pair:1, prompt:"Question #1. Which of the following characters in an ancient script represents an animal?" },
  { pair:2, prompt:"Question #2. Which of the following characters in an ancient script represents a person?" },
  { pair:3, prompt:"Question #3. Which of the following characters in an ancient script represents a bird?" },
  { pair:4, prompt:"Question #4. Which of the following characters in an ancient script represents a rodent?" }
];

const round2Questions = [
  "Question #1. Which of the following characters represents a non-living stationary object?",
  "Question #2. Which of the following characters represents a non-living stationary object?",
  "Question #3. Which of the following characters represents a non-living stationary object?",
  "Question #4. Which of the following characters represents a non-living stationary object?"
];

const round3Questions = [
  "Round 3 - Question #1. Please select the image that matches the new instruction.",
  "Round 3 - Question #2. Please select the image that matches the new instruction.",
  "Round 3 - Question #3. Please select the image that matches the new instruction.",
  "Round 3 - Question #4. Please select the image that matches the new instruction."
];

const round4Questions = [
  "Round 4 - Question #1. Which image did you pick earlier in Round 3 for Pair 1?",
  "Round 4 - Question #2. Which image did you pick earlier in Round 3 for Pair 2?",
  "Round 4 - Question #3. Which image did you pick earlier in Round 3 for Pair 3?",
  "Round 4 - Question #4. Which image did you pick earlier in Round 3 for Pair 4?"
];

const imagePairs = [
  { A:"img/Pair 1 Image A.png", B:"img/Pair 1 Image B.png" },
  { A:"img/Pair 2 Image A.png", B:"img/Pair 2 Image B.png" },
  { A:"img/Pair 3 Image A.png", B:"img/Pair 3 Image B.png" },
  { A:"img/Pair 4 Image A.png", B:"img/Pair 4 Image B.png" }
];

const imagePairsRound3 = [
  { A:"img/R3 Pair 1 A.png", B:"img/R3 Pair 1 B.png" },
  { A:"img/R3 Pair 2 A.png", B:"img/R3 Pair 2 B.png" },
  { A:"img/R3 Pair 3 A.png", B:"img/R3 Pair 3 B.png" },
  { A:"img/R3 Pair 4 A.png", B:"img/R3 Pair 4 B.png" }
];

const round1Choices = [null,null,null,null];
const round3Choices = [null,null,null,null];
const round3Answers = [null,null,null,null];

function imgChoice(src, alt) { return `<img class="choice-img" src="${src}" alt="${alt}">`; }

/**************** ROUNDS UI ****************/
const intro1 = {
  type: jsPsychHtmlKeyboardResponse,
  stimulus: `
  <div class="centered">
    <p>Welcome! Today you will answer some language questions about a researcher-manufactured ancient script.</p>
    <p>Whether you get the answers right or wrong in Round 1, try to learn. Round 2 will test how much you learned.</p>
    <p style="text-align:center;"><strong>Press space to continue.</strong></p>
  </div>`,
  choices: [' ']
};

const intro2 = {
  type: jsPsychHtmlKeyboardResponse,
  stimulus: `
  <div class="centered">
    <p>People often assume they naturally learn from their mistakes, but research shows this process is more difficult and less automatic than it seems.</p>
    <p style="text-align:center;"><strong>Press space to begin Round 1.</strong></p>
  </div>`,
  choices: [' '],
  on_finish: d => d.reading_time = d.rt
};

function makeRound1Trial(i) {
  const pair = imagePairs[i];
  const q = round1Questions[i];
  return {
    type: jsPsychHtmlButtonResponse,
    stimulus: `<div class="centered"><div class="question-title">${q.prompt}</div></div>`,
    choices: [imgChoice(pair.A,"A"), imgChoice(pair.B,"B")],
    data: { round: 1 },
    on_finish: function(d){
      const c = (d.response===0) ? "A" : "B";
      d.choice_label = c;
      d.chosen_image = (d.response === 0) ? pair.A : pair.B;
      round1Choices[i] = c;
    }
  };
}

const incorrectFeedback = {
  type: jsPsychHtmlKeyboardResponse,
  stimulus: `<div class="centered"><div class="incorrect-banner">YOU ANSWERED THIS QUESTION INCORRECT!</div><div class="press-space">Press space to continue.</div></div>`,
  choices: [' ']
};

const breakScreen = {
  type: jsPsychHtmlButtonResponse,
  stimulus: `
  <div class="centered">
    <p>Thanks for answering those initial questions. Right now, take a short breather.</p>
    <p><strong>Tell us: what is your favorite music to listen to?</strong></p>
    <p>Please take two minutes and write your answer in the textbox below.</p>
    <div class="break-box">
      <div style="flex:1;"><textarea id="music" placeholder="Type your answer here..."></textarea></div>
      <div class="countdown" id="countdown">2:00</div>
    </div>
  </div>`,
  choices: ['Submit'],
  button_html: '<button class="jspsych-btn" type="button" disabled>%choice%</button>',
  on_load: function(){
    const btn = document.querySelector('.jspsych-html-button-response-button button');
    const el = document.getElementById('countdown');
    let total = BREAK_SECONDS;
    el.textContent = `${Math.floor(total/60)}:${String(total%60).padStart(2,'0')}`;
    const id = setInterval(()=>{
      total--;
      el.textContent = `${Math.floor(Math.max(total,0)/60)}:${String(Math.max(total,0)%60).padStart(2,'0')}`;
      if(total<=0){ clearInterval(id); btn.disabled=false; }
    },1000);
    // store interval to clear if necessary
    this._breakIntervalId = id;
  },
  on_finish: function(d){
    if(this._breakIntervalId) clearInterval(this._breakIntervalId);
    const txt = document.getElementById('music');
    d.favorite_music = txt ? txt.value : '';
  }
};

const round2Intro = {
  type: jsPsychHtmlKeyboardResponse,
  stimulus: `<div class="centered"><p><strong>This is Round 2.</strong></p><p>Based on what you learned ...</p><p style="text-align:center;"><strong>Press space to begin.</strong></p></div>`,
  choices: [' ']
};

function makeRound2Trial(i) {
  const pair = imagePairs[i];
  return {
    type: jsPsychHtmlButtonResponse,
    stimulus: `<div class="centered"><div class="question-title">${round2Questions[i]}</div></div>`,
    choices: [imgChoice(pair.A,"A"), imgChoice(pair.B,"B")],
    data: { round: 2 },
    on_finish: function(d){
      const choiceLabel = (d.response===0) ? "A" : "B";
      const r1Choice = round1Choices[i];
      const correct = (ROUND2_CORRECT_RULE === 'different') ? (choiceLabel !== r1Choice) : (choiceLabel === r1Choice);
      d.choice_label = choiceLabel;
      d.chosen_image = (d.response === 0) ? pair.A : pair.B;
      d.round1_choice_for_pair = r1Choice;
      d.correct = correct ? 1 : 0;
    }
  };
}

const round3Intro = {
  type: jsPsychHtmlKeyboardResponse,
  stimulus: `<div class="centered"><p><strong>This is Round 3.</strong></p><p>...Press space to begin Round 3.</p></div>`,
  choices: [' ']
};

function makeRound3Trial(i) {
  const pair = imagePairsRound3[i];
  return {
    type: jsPsychHtmlButtonResponse,
    stimulus: `<div class="centered"><div class="question-title">${round3Questions[i]}</div></div>`,
    choices: [imgChoice(pair.A,"A"), imgChoice(pair.B,"B")],
    data: { round: 3 },
    on_finish: function(d){
      const c = (d.response===0) ? "A" : "B";
      d.choice_label = c;
      d.chosen_image = (d.response === 0) ? pair.A : pair.B;
      round3Choices[i] = c;
      const key = round3Answers[i];
      d.correct = (key === 'A' || key === 'B') ? (c === key ? 1 : 0) : null;
    }
  };
}

const positiveFeedback = {
  type: jsPsychHtmlKeyboardResponse,
  stimulus: `<div class="centered"><div class="feedback-banner">YOU ANSWERED THIS QUESTION CORRECT!</div><div class="press-space">Press space to continue.</div></div>`,
  choices: [' ']
};

const break2Screen = {
  type: jsPsychHtmlButtonResponse,
  stimulus: `
  <div class="centered">
    <p>Thanks — before the final recall round, please take a short writing break.</p>
    <p><strong>Write briefly about a recent experience you enjoyed.</strong></p>
    <div class="break-box">
      <div style="flex:1;"><textarea id="writing" placeholder="Type your answer here..."></textarea></div>
      <div class="countdown" id="countdown2">2:00</div>
    </div>
  </div>`,
  choices: ['Submit'],
  button_html: '<button class="jspsych-btn" type="button" disabled>%choice%</button>',
  on_load: function(){
    const btn = document.querySelector('.jspsych-html-button-response-button button');
    const el = document.getElementById('countdown2');
    let total = BREAK_SECONDS;
    el.textContent = `${Math.floor(total/60)}:${String(total%60).padStart(2,'0')}`;
    const id = setInterval(()=>{
      total--;
      el.textContent = `${Math.floor(Math.max(total,0)/60)}:${String(Math.max(total,0)%60).padStart(2,'0')}`;
      if(total<=0){ clearInterval(id); btn.disabled=false; }
    },1000);
    this._break2IntervalId = id;
  },
  on_finish: function(d){
    if(this._break2IntervalId) clearInterval(this._break2IntervalId);
    const txt = document.getElementById('writing');
    d.favorite_writing = txt ? txt.value : '';
  }
};

const round4Intro = {
  type: jsPsychHtmlKeyboardResponse,
  stimulus: `<div class="centered"><p><strong>This is Round 4 (Recall).</strong></p><p>Press space to begin.</p></div>`,
  choices: [' ']
};

function makeRound4Trial(i) {
  const pair = imagePairsRound3[i];
  return {
    type: jsPsychHtmlButtonResponse,
    stimulus: `<div class="centered"><div class="question-title">${round4Questions[i]}</div></div>`,
    choices: [imgChoice(pair.A,"A"), imgChoice(pair.B,"B")],
    data: { round: 4 },
    on_finish: function(d){
      const c = (d.response===0) ? "A" : "B";
      d.choice_label = c;
      d.chosen_image = (d.response === 0) ? pair.A : pair.B;
      d.correct = (c === round3Choices[i]) ? 1 : 0;
      d.round3_choice_for_pair = round3Choices[i];
    }
  };
}

/**************** SQUARED TASK (complete embedded) ****************/
function getSquaredTimeline() {
  const practice_duration = 30000;
  const main_duration = 90000;

  function countdown_local(start, timelimit) {
    const timeleft_bar = document.getElementById("timeleft");
    if (!timeleft_bar) return;
    let timeleft_width = (timelimit - (Date.now() - start)) * 100 / timelimit;
    function shorten_timebar() {
      if (timeleft_width <= 0) {
        clearInterval(update_timeleft);
      } else {
        timeleft_width -= 10 * 100 / timelimit;
        timeleft_bar.style.width = timeleft_width + "%";
      }
    }
    const update_timeleft = setInterval(shorten_timebar, 10);
  }

  const al = "squared/al.PNG";
  const ar = "squared/ar.PNG";
  const mr_fl = "squared/mr_fl.PNG";
  const ml_fr = "squared/ml_fr.PNG";
  const rarr = "squared/rarr.PNG";
  const larr = "squared/larr.PNG";

  // STIMULI arrays copied from original squared.js (same as earlier)
  const stimuli_stroop = [
    {stim: "RED", stimcolor: "#ff0302", resp1: "BLUE", resp1color: "#0000FF", resp2: "RED", resp2color: "#ff0302", correct_response: 1, condition: 1},
    {stim: "RED", stimcolor: "#ff0302", resp1: "RED", resp1color: "#ff0302", resp2: "BLUE", resp2color: "#0000FF", correct_response: 0, condition: 1},
    {stim: "BLUE", stimcolor: "#0000FF", resp1: "BLUE", resp1color: "#0000FF", resp2: "RED", resp2color: "#ff0302", correct_response: 0, condition: 1},
    {stim: "BLUE", stimcolor: "#0000FF", resp1: "RED", resp1color: "#ff0302", resp2: "BLUE", resp2color: "#0000FF", correct_response: 1, condition: 1},
    {stim: "RED", stimcolor: "#ff0302", resp1: "RED", resp1color: "#0000FF", resp2: "BLUE", resp2color: "#ff0302", correct_response: 0, condition: 2},
    {stim: "RED", stimcolor: "#ff0302", resp1: "BLUE", resp1color: "#ff0302", resp2: "RED", resp2color: "#0000FF", correct_response: 1, condition: 2},
    {stim: "BLUE", stimcolor: "#0000FF", resp1: "RED", resp1color: "#0000FF", resp2: "BLUE", resp2color: "#ff0302", correct_response: 1, condition: 2},
    {stim: "BLUE", stimcolor: "#0000FF", resp1: "BLUE", resp1color: "#ff0302", resp2: "RED", resp2color: "#0000FF", correct_response: 0, condition: 2},
    {stim: "RED", stimcolor: "#0000FF", resp1: "BLUE", resp1color: "#0000FF", resp2: "RED", resp2color: "#ff0302", correct_response: 0, condition: 3},
    {stim: "RED", stimcolor: "#0000FF", resp1: "RED", resp1color: "#ff0302", resp2: "BLUE", resp2color: "#0000FF", correct_response: 1, condition: 3},
    {stim: "BLUE", stimcolor: "#ff0302", resp1: "BLUE", resp1color: "#0000FF", resp2: "RED", resp2color: "#ff0302", correct_response: 1, condition: 3},
    {stim: "BLUE", stimcolor: "#ff0302", resp1: "RED", resp1color: "#ff0302", resp2: "BLUE", resp2color: "#0000FF", correct_response: 0, condition: 3},
    {stim: "RED", stimcolor: "#0000FF", resp1: "RED", resp1color: "#0000FF", resp2: "BLUE", resp2color: "#ff0302", correct_response: 1, condition: 4},
    {stim: "RED", stimcolor: "#0000FF", resp1: "BLUE", resp1color: "#ff0302", resp2: "RED", resp2color: "#0000FF", correct_response: 0, condition: 4},
    {stim: "BLUE", stimcolor: "#ff0302", resp1: "RED", resp1color: "#0000FF", resp2: "BLUE", resp2color: "#ff0302", correct_response: 0, condition: 4},
    {stim: "BLUE", stimcolor: "#ff0302", resp1: "BLUE", resp1color: "#ff0302", resp2: "RED", resp2color: "#0000FF", correct_response: 1, condition: 4}
  ];

  const stimuli_flanker = [
    {stim: al, stimsign: "<<<<<", resp1: ar, resp1sign: ">>>>>", resp2: al, resp2sign: "<<<<<", correct_response: 1, condition: 1},
    {stim: al, stimsign: "<<<<<", resp1: al, resp1sign: "<<<<<", resp2: ar, resp2sign: ">>>>>", correct_response: 0, condition: 1},
    {stim: ar, stimsign: ">>>>>", resp1: ar, resp1sign: ">>>>>", resp2: al, resp2sign: "<<<<<", correct_response: 0, condition: 1},
    {stim: ar, stimsign: ">>>>>", resp1: al, resp1sign: "<<<<<", resp2: ar, resp2sign: ">>>>>", correct_response: 1, condition: 1},
    {stim: al, stimsign: "<<<<<", resp1: ml_fr, resp1sign: ">><>>", resp2: mr_fl, resp2sign: "<<><<", correct_response: 0, condition: 2},
    {stim: al, stimsign: "<<<<<", resp1: mr_fl, resp1sign: "<<><<", resp2: ml_fr, resp2sign: ">><>>", correct_response: 1, condition: 2},
    {stim: ar, stimsign: ">>>>>", resp1: ml_fr, resp1sign: ">><>>", resp2: mr_fl, resp2sign: "<<><<", correct_response: 1, condition: 2},
    {stim: ar, stimsign: ">>>>>", resp1: mr_fl, resp1sign: "<<><<", resp2: ml_fr, resp2sign: ">><>>", correct_response: 0, condition: 2},

    {stim: ml_fr, stimsign: ">><>>", resp1: mr_fl, resp1sign: "<<><<", resp2: ml_fr, resp2sign: ">><>>", correct_response: 0, condition: 4},
    {stim: ml_fr, stimsign: ">><>>", resp1: ml_fr, resp1sign: ">><>>", resp2: mr_fl, resp2sign: "<<><<", correct_response: 1, condition: 4}
  ];

  const stimuli_simon = [
    {stim: larr, stimsign: "<", loc: "left", resp1: "LEFT", resp2: "RIGHT", correct_response: 0, condition: 1},
    {stim: rarr, stimsign: ">", loc: "right", resp1: "LEFT", resp2: "RIGHT", correct_response: 1, condition: 1},
    {stim: larr, stimsign: "<", loc: "left", resp1: "RIGHT", resp2: "LEFT", correct_response: 1, condition: 2},
    {stim: rarr, stimsign: ">", loc: "right", resp1: "RIGHT", resp2: "LEFT", correct_response: 0, condition: 2},
    {stim: larr, stimsign: "<", loc: "right", resp1: "LEFT", resp2: "RIGHT", correct_response: 0, condition: 3},
    {stim: rarr, stimsign: ">", loc: "left", resp1: "LEFT", resp2: "RIGHT", correct_response: 1, condition: 3},
    {stim: larr, stimsign: "<", loc: "right", resp1: "RIGHT", resp2: "LEFT", correct_response: 1, condition: 4},
    {stim: rarr, stimsign: ">", loc: "left", resp1: "RIGHT", resp2: "LEFT", correct_response: 0, condition: 4}
  ];

  // helper: create blocks — these are local factories returning timeline fragments plus conclusions
  function createStroopBlock() {
    const items = Array.from(Array(16).keys());
    const practice_order = jsPsych.randomization.sampleWithReplacement(items, 100);

    // build trial & feedback templates using closures for each block
    function makeBlock(orderArray) {
      let block_trial_count = 0;

          if(block_trial_count===0) {

        on_finish: function(data){
          data.task="stroop";
          data.practice=practice_flag;
          data.item=orderArray[block_trial_count];
          data.stim=stimuli_stroop[orderArray[block_trial_count]].stim;
          data.stimcolor=stimuli_stroop[orderArray[block_trial_count]].stimcolor;
          data.resp1=stimuli_stroop[orderArray[block_trial_count]].resp1;

          data.correct_response=stimuli_stroop[orderArray[block_trial_count]].correct_response;
          data.condition=stimuli_stroop[orderArray[block_trial_count]].condition;
          data.accuracy = data.response == data.correct_response ? 1 : 0;
          data.timeout = timeout;
          if(timeout===0) total_score = data.accuracy==1 ? total_score+1 : total_score-1;
          data.score_after_trial = total_score;
        }
      };

      const feedback = {
        type: jsPsychHtmlButtonResponse,
        stimulus: function(){ return display_stroop(orderArray[block_trial_count]); },
        choices: function(){ return [stimuli_stroop[orderArray[block_trial_count]].resp1, stimuli_stroop[orderArray[block_trial_count]].resp2]; },
        button_html: function(){
          const last = jsPsych.data.get().last(1).values()[0] || {};
          const resp = last.response;
          const correct_response = last.correct_response;
          let fb1 = '<div style="height:28px;"></div>';
          let fb2 = '<div style="height:28px;"></div>';
          if(resp===0) fb1 = (correct_response==0) ? '<div style="color:#1ED760">&#10004;</div>' : '<div style="color:red">&#10008;</div>';

      };

      const block_timeline = { timeline: [trial, feedback], loop_function: function(){ return true; } };

      // Provide a way to set practice/main flag externally
      block_timeline.setPracticeFlag = function(val){ practice_flag = val; };

      // expose total_score via closure when concluding
      block_timeline.getTotal = function(){ return total_score; };

    // assemble practice and main blocks
    const practiceBlock = makeBlock(practice_order); practiceBlock.setPracticeFlag(1);

    const intro1 = { type: jsPsychHtmlButtonResponse, stimulus:"<div class='centered'><p>Stroop practice: 30 seconds</p></div>", choices:["Begin practice"] };

    const intro2 = { type: jsPsychHtmlButtonResponse, stimulus:"<div class='centered'><p>Stroop main: 90 seconds</p></div>", choices:["I understand"] };
    const prepMain = { type: jsPsychHtmlButtonResponse, stimulus:"<div class='centered'><p>Start main</p></div>", choices:["Start task"], on_finish: function(){ /* nothing */ } };

    const conclusion = {
      type: jsPsychHtmlButtonResponse,
      stimulus: function(){ return `<div class='centered'><p>You completed Stroop practice+main.</p><p>Click Continue.</p></div>`; },
      choices: ["Continue"],
      on_start: function(){
        // compute and add summary fields for practice/main into data
        jsPsych.data.get().filter({task:"stroop", practice:1}).addToAll({
          score_final: jsPsych.data.get().filter({task:"stroop", practice:1, timeout:0}).last(1).values()[0]?.score_after_trial || '',
          meanrt_final: jsPsych.data.get().filter({task:"stroop", practice:1, timeout:0}).select('rt').mean() || ''
        });
        jsPsych.data.get().filter({task:"stroop", practice:0}).addToAll({
          score_final: jsPsych.data.get().filter({task:"stroop", practice:0, timeout:0}).last(1).values()[0]?.score_after_trial || '',
          meanrt_final: jsPsych.data.get().filter({task:"stroop", practice:0, timeout:0}).select('rt').mean() || ''
        });
      }
    };

    return [intro1, prepPractice, practiceBlock, intro2, prepMain, mainBlock, conclusion];
  } // end createStroopBlock

  function createFlankerBlock() {

        jsPsych.data.get().filter({ task:"flanker", practice:1 }).addToAll({
          score_final: jsPsych.data.get().filter({ task:"flanker", practice:1, timeout:0 }).last(1).values()[0]?.score_after_trial || '',

};

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>LFF Task - Version 1 (with Round 3 & 4)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" href="jspsych/jspsych.css" />

  <script src="jspsych/jspsych.js"></script>
  <script src="jspsych/plugin-preload.js"></script>
  <script src="jspsych/plugin-html-keyboard-response.js"></script>
  <script src="jspsych/plugin-html-button-response.js"></script>

  <style>
    body { background:#fafafa; font-family: Arial, sans-serif; color:#111; }
    .centered { max-width:900px; margin:0 auto; padding:24px; line-height:1.45; }
    .question-title { font-size:22px; font-weight:600; margin-bottom:16px; }

    .image-choice-container {
      display:flex;
      justify-content:center;
      gap:40px;
      flex-wrap:wrap;
      margin-top:18px;
    }

    .choice-img {
      max-width:360px;
      max-height:320px;
      border:2px solid #ddd;
      border-radius:6px;
    }

    .vertical-btn {
      display:block;
      width:700px;
      max-width:90%;
      margin:10px auto;
      text-align:left;
      padding:12px;
    }

    /* Feedback banner: now positive/green */
    .feedback-banner {
      font-size:30px;
      font-weight:700;
      color:#006400; /* darkgreen */
      text-align:center;
      margin:16px 0 24px;
    }

    .press-space { text-align:center; margin-top:24px; }

    .break-box {
      display:flex;
      gap:24px;
      align-items:flex-start;
      justify-content:space-between;
      flex-wrap:wrap;
      margin-top:10px;
    }

    textarea#music {
      width:100%;
      min-height:160px;
      font-size:16px;
      padding:12px;
      border:2px solid #ccc;
      border-radius:6px;
      resize:vertical;
    }

    .countdown {
      flex:0 0 220px;
      font-size:18px;
      border:2px solid #ccc;
      border-radius:6px;
      padding:12px;
      height:56px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#fff;
    }
  </style>
</head>

<body>
<div id="jspsych-target"></div>

<script>

/**************** CONFIG ****************/
const VERSION = "v1";
// set to 'same' or 'different' to change Round 2 correctness rule
const ROUND2_CORRECT_RULE = "same";
const BREAK_SECONDS = 120;
const QUALTRICS_RETURN_URL = "https://merceruniversity.co1.qualtrics.com/jfe/form/SV_eEG4o0S1x2n2DFI";

/**************** INIT ****************/
const jsPsych = initJsPsych({ display_element: 'jspsych-target' });
jsPsych.data.addProperties({ version: VERSION });

/**************** PAYLOAD BUILDER ****************/
function buildSummaryPayload() {
  const all = jsPsych.data.get().values();

  // Round 1 - 4
  const r1 = all.filter(d => d.round === 1);
  const r2 = all.filter(d => d.round === 2);
  const r3 = all.filter(d => d.round === 3);
  const r4 = all.filter(d => d.round === 4);

  const r1_choices = r1.map(d => d.choice_label || '').join(',');
  const r2_choices = r2.map(d => d.choice_label || '').join(',');
  const r3_choices = r3.map(d => d.choice_label || '').join(',');
  const r4_choices = r4.map(d => d.choice_label || '').join(',');

  const r2_correct_arr = r2.map(d => Number(d.correct || 0));
  const r2_correct = r2_correct_arr.join(',');
  const r2_total = r2_correct_arr.reduce((a, b) => a + b, 0);

  const r3_correct_arr = r3.map(d => Number(d.correct || 0));
  const r3_correct = r3_correct_arr.join(',');
  const r3_total = r3_correct_arr.reduce((a,b)=>a+b,0);

  const r4_correct_arr = r4.map(d => Number(d.correct || 0));
  const r4_correct = r4_correct_arr.join(',');
  const r4_total = r4_correct_arr.reduce((a,b)=>a+b,0);

  const rt_r1 = r1.map(d => d.rt || '').join(',');
  const rt_r2 = r2.map(d => d.rt || '').join(',');
  const rt_r3 = r3.map(d => d.rt || '').join(',');
  const rt_r4 = r4.map(d => d.rt || '').join(',');

  // Find break row and reading row (unchanged)
  const breakRow = all.find(d => d.favorite_music !== undefined);
  const music = breakRow ? breakRow.favorite_music : "";
  const music_short = music.length > 150 ? music.slice(0, 150) : music;

  const readingRow = all.find(d => d.reading_time !== undefined);
  const reading_time = readingRow ? readingRow.reading_time : '';

  return {
    r1_choices,
    r2_choices,
    r3_choices,
    r4_choices,
    r2_correct,
    r2_total: String(r2_total),
    r3_correct,
    r3_total: String(r3_total),
    r4_correct,
    r4_total: String(r4_total),
    rt_r1,
    rt_r2,
    rt_r3,
    rt_r4,
    music_short,
    reading_time
  };
}

/**************** DATA ****************/
const round1Questions = [
  { pair:1, prompt:"Question #1. Which of the following characters in an ancient script represents an animal?" },
  { pair:2, prompt:"Question #2. Which of the following characters in an ancient script represents a person?" },
  { pair:3, prompt:"Question #3. Which of the following characters in an ancient script represents a bird?" },
  { pair:4, prompt:"Question #4. Which of the following characters in an ancient script represents a rodent?" }
];

const round2Questions = [
  "Question #1. Which of the following characters represents a non-living stationary object?",
  "Question #2. Which of the following characters represents a non-living stationary object?",
  "Question #3. Which of the following characters represents a non-living stationary object?",
  "Question #4. Which of the following characters represents a non-living stationary object?"
];

// Round 3 (separate questions set)
const round3Questions = [
  "Round 3 - Question #1. Please select the image that matches the new instruction.",
  "Round 3 - Question #2. Please select the image that matches the new instruction.",
  "Round 3 - Question #3. Please select the image that matches the new instruction.",
  "Round 3 - Question #4. Please select the image that matches the new instruction."
];

// Round 4 (recall of Round 1 choices)
const round4Questions = [
  "Round 4 - Question #1. Which image did you pick earlier for Pair 1?",
  "Round 4 - Question #2. Which image did you pick earlier for Pair 2?",
  "Round 4 - Question #3. Which image did you pick earlier for Pair 3?",
  "Round 4 - Question #4. Which image did you pick earlier for Pair 4?"
];

const imagePairs = [
  { A:"img/Pair 1 Image A.png", B:"img/Pair 1 Image B.png" },
  { A:"img/Pair 2 Image A.png", B:"img/Pair 2 Image B.png" },
  { A:"img/Pair 3 Image A.png", B:"img/Pair 3 Image B.png" },
  { A:"img/Pair 4 Image A.png", B:"img/Pair 4 Image B.png" }
];

// separate image set for Round 3 — replace these placeholder paths when your images are ready
const imagePairsRound3 = [
  { A:"img/R3 Pair 1 A.png", B:"img/R3 Pair 1 B.png" },
  { A:"img/R3 Pair 2 A.png", B:"img/R3 Pair 2 B.png" },
  { A:"img/R3 Pair 3 A.png", B:"img/R3 Pair 3 B.png" },
  { A:"img/R3 Pair 4 A.png", B:"img/R3 Pair 4 B.png" }
];

const round1Choices = [null,null,null,null];

// Answer key for Round 3 — fill with 'A' or 'B' if you want client scoring
const round3Answers = [null, null, null, null];

/**************** HELPERS ****************/
function imgChoice(src, alt) {
  return `<img class="choice-img" src="${src}" alt="${alt}">`;
}

/**************** INTRO ****************/
const intro1 = {
  type: jsPsychHtmlKeyboardResponse,
  stimulus: `
  <div class="centered">
    <p>Welcome! Today you will answer some language questions about a researcher-manufactured ancient script.</p>
    <p>Whether you get the answers right or wrong in Round 1, try to learn. Round 2 will test how much you learned.</p>
    <p style="text-align:center;"><strong>Press space to continue.</strong></p>
  </div>`,
  choices: [' ']
};

const intro2 = {
  type: jsPsychHtmlKeyboardResponse,
  stimulus: `
  <div class="centered">
    <p>People often assume they naturally learn from their mistakes, but research shows this process is more difficult and less automatic than it seems.</p>
    <p>When something goes wrong, people frequently feel confident that they will remember what happened and why — yet those details are easy to misinterpret or forget. As a result, individuals may repeat the same errors without realizing it.</p>
    <p>As you complete the next task, keep in mind that learning from failure requires deliberate attention and that your memory for what happens may not be as reliable as it feels.</p>
    <p style="text-align:center;"><strong>Press space to begin Round 1.</strong></p>
  </div>`,
  choices: [' '],
  on_finish: d => d.reading_time = d.rt
};

/**************** ROUND 1 ****************/
function makeRound1Trial(i){
  const pair = imagePairs[i];
  const q = round1Questions[i];
  return {
    type: jsPsychHtmlButtonResponse,
    stimulus: `<div class="centered"><div class="question-title">${q.prompt}</div></div>`,
    choices: [imgChoice(pair.A,"A"), imgChoice(pair.B,"B")],
    data: { round: 1 },
    on_finish: function(d){
      const c = (d.response===0) ? "A" : "B";
      d.choice_label = c;
      round1Choices[i] = c;
    }
  };
}

/**************** POSITIVE FEEDBACK (used after Round 1 selections) ****************/
const positiveFeedback = {
  type: jsPsychHtmlKeyboardResponse,
  stimulus: `
  <div class="centered">
    <div class="feedback-banner">YOU ANSWERED THIS QUESTION CORRECT!</div>
    <div class="press-space">Press space to continue.</div>
  </div>`,
  choices:[' ']
};

/**************** BREAK ****************/
let breakIntervalId=null;

const breakScreen = {
  type: jsPsychHtmlButtonResponse,
  stimulus: `
  <div class="centered">
    <p>Thanks for answering those initial questions. Right now, take a short breather.</p>
    <p><strong>Tell us: what is your favorite music to listen to?</strong></p>
    <p>Please take two minutes and write your answer in the textbox below.</p>

    <div class="break-box">
      <div style="flex:1;">
        <textarea id="music" placeholder="Type your answer here..."></textarea>
      </div>
      <div class="countdown" id="countdown">2:00</div>
    </div>
  </div>
  `,
  choices: ['Submit'],
  button_html: '<button class="jspsych-btn" type="button" disabled>%choice%</button>',

  on_load: function(){
    const btn = document.querySelector('.jspsych-html-button-response-button button');
    const el = document.getElementById('countdown');

    let total = BREAK_SECONDS;

    function formatTime(s){
      return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
    }

    el.textContent = formatTime(total);

    breakIntervalId = setInterval(()=>{
      total--;
      el.textContent = formatTime(Math.max(total,0));
      if(total<=0){
        clearInterval(breakIntervalId);
        btn.disabled = false;
      }
    },1000);
  },

  on_finish: function(d){
    if(breakIntervalId){ clearInterval(breakIntervalId); }
    const txt = document.getElementById('music');
    d.favorite_music = txt ? txt.value : '';
  }
};

/**************** ROUND 2 INTRO ****************/
const round2Intro = {
  type: jsPsychHtmlKeyboardResponse,
  stimulus: `
  <div class="centered">
    <p><strong>This is Round 2.</strong></p>
    <p>Based on what you learned about the researcher-manufactured ancient script in Round 1, answer the next four questions by selecting the appropriate image.</p>
    <p style="text-align:center;"><strong>Press space bar to begin answering the questions.</strong></p>
  </div>`,
  choices:[' ']
};

/**************** ROUND 2 (with Version 2 scoring) ****************/
function makeRound2Trial(i){
  const pair = imagePairs[i];
  return {
    type: jsPsychHtmlButtonResponse,
    stimulus: `<div class="centered"><div class="question-title">${round2Questions[i]}</div></div>`,
    choices: [imgChoice(pair.A,"A"), imgChoice(pair.B,"B")],
    data: { round: 2 },
    on_finish: function(d){
      // choice label A/B
      const choiceLabel = (d.response === 0) ? "A" : "B";
      // what they chose in Round 1 for the same pair
      const r1Choice = round1Choices[i];

      // ✅ Version 2 scoring: correct is NOT what they chose in Round 1 when rule === 'different'
      const correct = (ROUND2_CORRECT_RULE === 'different')
        ? (choiceLabel !== r1Choice)
        : (choiceLabel === r1Choice);

      // extra fields per your snippet
      d.choice_label = choiceLabel;
      d.chosen_image = (d.response === 0) ? pair.A : pair.B;
      d.round1_choice_for_pair = r1Choice;
      d.correct = correct ? 1 : 0;
    }
  };
}

/**************** ROUND 3 INTRO (NEW) ****************/
const round3Intro = {
  type: jsPsychHtmlKeyboardResponse,
  stimulus: `
  <div class="centered">
    <p><strong>This is Round 3.</strong></p>
    <p>This round uses a different set of images and will be scored separately. When you are ready, press space to begin.</p>
    <p style="text-align:center;"><strong>Press space to begin Round 3.</strong></p>
  </div>`,
  choices:[' ']
};

/**************** ROUND 3 (NEW) ****************/
function makeRound3Trial(i){
  const pair = imagePairsRound3[i];
  return {
    type: jsPsychHtmlButtonResponse,
    stimulus: `<div class="centered"><div class="question-title">${round3Questions[i]}</div></div>`,
    choices: [imgChoice(pair.A,"A"), imgChoice(pair.B,"B")],
    data: { round: 3 },
    on_finish: function(d){
      const c = (d.response===0) ? "A" : "B";
      d.choice_label = c;

      const key = round3Answers[i];
      if(key === 'A' || key === 'B'){
        d.correct = (c === key) ? 1 : 0;
      } else {
        d.correct = null;
      }

      d.chosen_image = (d.response === 0) ? pair.A : pair.B;
    }
  };
}

/**************** ROUND 4 INTRO (NEW - Recall) ****************/
const round4Intro = {
  type: jsPsychHtmlKeyboardResponse,
  stimulus: `
  <div class="centered">
    <p><strong>This is Round 4 (Recall).</strong></p>
    <p>Now we will ask you to recall which image you chose earlier for each pair. Select the image you remember picking before.</p>
    <p style="text-align:center;"><strong>Press space to begin Round 4.</strong></p>
  </div>`,
  choices:[' ']
};

/**************** ROUND 4 (NEW) ****************/
function makeRound4Trial(i){
  // Use the same imagePairs as Round 1 so we can compare to round1Choices
  const pair = imagePairs[i];
  return {
    type: jsPsychHtmlButtonResponse,
    stimulus: `<div class="centered"><div class="question-title">${round4Questions[i]}</div></div>`,
    choices: [imgChoice(pair.A,"A"), imgChoice(pair.B,"B")],
    data: { round: 4 },
    on_finish: function(d){
      const c = (d.response===0) ? "A" : "B";
      d.choice_label = c;
      d.chosen_image = (d.response === 0) ? pair.A : pair.B;
      // correctness = whether they recall what they originally chose in Round 1
      d.correct = (c === round1Choices[i]) ? 1 : 0;
      // store what they originally chose for traceability
      d.round1_choice = round1Choices[i];
    }
  };
}

/**************** FINAL SCREEN ****************/
const finalScreen = {
  type: jsPsychHtmlButtonResponse,
  stimulus: `
  <div class="centered" style="text-align:center;">
    <p><strong>Thank you for your participation!</strong></p>
    <p>Click continue to return to Prolific.</p>
  </div>
  `,
  choices: ['Continue'],
  on_finish: function(){
    const payload = buildSummaryPayload();

    const params = new URLSearchParams(window.location.search);

    const q = new URLSearchParams({
      PROLIFIC_PID: params.get('PROLIFIC_PID') || '',
      STUDY_ID: params.get('STUDY_ID') || '',
      SESSION_ID: params.get('SESSION_ID') || '',
      version: VERSION,
      ...payload
    });

    window.location.href = `${QUALTRICS_RETURN_URL}?${q.toString()}`;
  }
};

/**************** TIMELINE ****************/
const timeline = [];

timeline.push(intro1, intro2);

for(let i=0;i<4;i++){
  timeline.push(makeRound1Trial(i));
  timeline.push(positiveFeedback); // show positive feedback after each Round 1 selection
}

timeline.push(breakScreen, round2Intro);

for(let i=0;i<4;i++){
  timeline.push(makeRound2Trial(i));
}

// Round 3
timeline.push(round3Intro);
for(let i=0;i<4;i++){
  timeline.push(makeRound3Trial(i));
}

// Round 4 (recall)
timeline.push(round4Intro);
for(let i=0;i<4;i++){
  timeline.push(makeRound4Trial(i));
}

timeline.push(finalScreen);

jsPsych.run(timeline);

</script>
</body>
</html>

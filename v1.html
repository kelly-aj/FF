function loadCSS(href){
  const link = document.createElement('link');
  link.rel = 'stylesheet';
  link.href = href;
  document.head.appendChild(link);
  return link;
}
function unloadCSS(link){
  if(link && link.parentNode) link.parentNode.removeChild(link);
}

  const joinChoices = arr => arr.map(d => d.choice_label || '').join(',');
  const r1_choices = joinChoices(r1), r2_choices = joinChoices(r2), r3_choices = joinChoices(r3), r4_choices = joinChoices(r4);

  const joinRT = arr => arr.map(d => d.rt || '').join(',');
  const rt_r1 = joinRT(r1), rt_r2 = joinRT(r2), rt_r3 = joinRT(r3), rt_r4 = joinRT(r4);

  const sumCounts = arr => arr.map(d => Number(d.correct || 0)).reduce((a,b)=>a+b,0);

  const r3_correct_arr = r3.map(d => Number(d.correct || 0));
  const r4_correct_arr = r4.map(d => Number(d.correct || 0));

    try {
      const filter = jsPsych.data.get().filter({ task: taskName, practice: 0, timeout: 0 });

  const br2 = all.find(d => d.favorite_writing !== undefined);
  const writing_short = br2 ? (br2.favorite_writing || '').slice(0,150) : '';

  };

  { pair:1, prompt:"Question #1. Which of the following characters in an ancient script represents an animal?" },

  "Round 3 - Question #1. Please select the image that matches the new instruction.",

  "Round 3 - Question #3. Please select the image that matches the new instruction.",
  "Round 3 - Question #4. Please select the image that matches the new instruction."
];

  "Round 4 - Question #1. Which image did you pick earlier in Round 3 for Pair 1?",

  "Round 4 - Question #3. Which image did you pick earlier in Round 3 for Pair 3?",
  "Round 4 - Question #4. Which image did you pick earlier in Round 3 for Pair 4?"
];

const imagePairs = [
  { A:"img/Pair 1 Image A.png", B:"img/Pair 1 Image B.png" },
  { A:"img/Pair 2 Image A.png", B:"img/Pair 2 Image B.png" },
  { A:"img/Pair 3 Image A.png", B:"img/Pair 3 Image B.png" },
  { A:"img/Pair 4 Image A.png", B:"img/Pair 4 Image B.png" }

  { A:"img/R3 Pair 1 A.png", B:"img/R3 Pair 1 B.png" },

const round3Choices = [null,null,null,null];
const round3Answers = [null,null,null,null];

  choices: [' ']
};
const intro2 = {
  type: jsPsychHtmlKeyboardResponse,
  stimulus: `<div class="centered"><p>Learning from failure requires attention. Press space to begin Round 1.</p></div>`,
  choices: [' '],
  on_finish: d => d.reading_time = d.rt
};

function makeRound1Trial(i){
  const pair = imagePairs[i];

  return {
    type: jsPsychHtmlButtonResponse,
    stimulus: `<div class="centered"><div class="question-title">${q.prompt}</div></div>`,
    choices: [imgChoice(pair.A,"A"), imgChoice(pair.B,"B")],
    data: { round: 1 },
    on_finish: function(d){
      const c = (d.response===0) ? "A" : "B";
      d.choice_label = c;
      d.chosen_image = (d.response === 0) ? pair.A : pair.B;
      round1Choices[i] = c;
    }
  };
}

  stimulus: `<div class="centered"><div class="incorrect-banner">YOU ANSWERED THIS QUESTION INCORRECT!</div><div class="press-space">Press space to continue.</div></div>`,
  choices: [' ']
};

  };

    this._interval = setInterval(()=>{ total--; el.textContent = `${Math.floor(Math.max(total,0)/60)}:${String(Math.max(total,0)%60).padStart(2,'0')}`; if(total<=0){ clearInterval(this._interval); btn.disabled=false; } },1000);
  },
  on_finish: function(d){ if(this._interval) clearInterval(this._interval); const txt = document.getElementById('writing'); d.favorite_writing = txt ? txt.value : ''; }

const round4Intro = {
  type: jsPsychHtmlKeyboardResponse,
  stimulus: `<div class="centered"><p><strong>This is Round 4 (Recall).</strong></p><p>Press space to begin.</p></div>`,
  choices: [' ']
};
function makeRound4Trial(i){

  return {
    type: jsPsychHtmlButtonResponse,
    stimulus: `<div class="centered"><div class="question-title">${round4Questions[i]}</div></div>`,
    choices: [imgChoice(pair.A,"A"), imgChoice(pair.B,"B")],
    data: { round: 4 },
    on_finish: function(d){ const c = (d.response===0) ? "A" : "B"; d.choice_label = c; d.chosen_image = (d.response===0) ? pair.A : pair.B; d.correct = (c === round3Choices[i]) ? 1 : 0; d.round3_choice_for_pair = round3Choices[i]; }
  };
}

/**************** SQUARED TASK (full restored with instructions and fixes) ****************/
function getSquaredTimeline() {
  // local scope & constants
  const PRACTICE_MS = 30000;
  const MAIN_MS = 90000;

  // helper (countdown bar)
  function countdown_local(start, timelimit) {
    const bar = document.getElementById('timeleft');
    if(!bar) return;
    let width = (timelimit - (Date.now() - start)) * 100 / timelimit;
    const step = () => {
      width -= 10 * 100 / timelimit;
      if(width <= 0){ clearInterval(update); bar.style.width = '0%'; } else { bar.style.width = width + '%'; }
    };
    const update = setInterval(step, 10);
  }

  // image paths
  const al = "squared/al.PNG", ar = "squared/ar.PNG", mr_fl = "squared/mr_fl.PNG", ml_fr = "squared/ml_fr.PNG", rarr = "squared/rarr.PNG", larr = "squared/larr.PNG";

  // stimuli arrays (same structure as original)
  const stimuli_stroop = [
    {stim:"RED", stimcolor:"#ff0302", resp1:"BLUE", resp1color:"#0000FF", resp2:"RED", resp2color:"#ff0302", correct_response:1, condition:1},
    {stim:"RED", stimcolor:"#ff0302", resp1:"RED", resp1color:"#ff0302", resp2:"BLUE", resp2color:"#0000FF", correct_response:0, condition:1},
    {stim:"BLUE", stimcolor:"#0000FF", resp1:"BLUE", resp1color:"#0000FF", resp2:"RED", resp2color:"#ff0302", correct_response:0, condition:1},
    {stim:"BLUE", stimcolor:"#0000FF", resp1:"RED", resp1color:"#ff0302", resp2:"BLUE", resp2color:"#0000FF", correct_response:1, condition:1},
    {stim:"RED", stimcolor:"#ff0302", resp1:"RED", resp1color:"#0000FF", resp2:"BLUE", resp2color:"#ff0302", correct_response:0, condition:2},
    {stim:"RED", stimcolor:"#ff0302", resp1:"BLUE", resp1color:"#ff0302", resp2:"RED", resp2color:"#0000FF", correct_response:1, condition:2},
    {stim:"BLUE", stimcolor:"#0000FF", resp1:"RED", resp1color:"#0000FF", resp2:"BLUE", resp2color:"#ff0302", correct_response:1, condition:2},
    {stim:"BLUE", stimcolor:"#0000FF", resp1:"BLUE", resp1color:"#ff0302", resp2:"RED", resp2color:"#0000FF", correct_response:0, condition:2},
    {stim:"RED", stimcolor:"#0000FF", resp1:"BLUE", resp1color:"#0000FF", resp2:"RED", resp2color:"#ff0302", correct_response:0, condition:3},
    {stim:"RED", stimcolor:"#0000FF", resp1:"RED", resp1color:"#ff0302", resp2:"BLUE", resp2color:"#0000FF", correct_response:1, condition:3},
    {stim:"BLUE", stimcolor:"#ff0302", resp1:"BLUE", resp1color:"#0000FF", resp2:"RED", resp2color:"#ff0302", correct_response:1, condition:3},
    {stim:"BLUE", stimcolor:"#ff0302", resp1:"RED", resp1color:"#ff0302", resp2:"BLUE", resp2color:"#0000FF", correct_response:0, condition:3},
    {stim:"RED", stimcolor:"#0000FF", resp1:"RED", resp1color:"#0000FF", resp2:"BLUE", resp2color:"#ff0302", correct_response:1, condition:4},
    {stim:"RED", stimcolor:"#0000FF", resp1:"BLUE", resp1color:"#ff0302", resp2:"RED", resp2color:"#0000FF", correct_response:0, condition:4},
    {stim:"BLUE", stimcolor:"#ff0302", resp1:"RED", resp1color:"#0000FF", resp2:"BLUE", resp2color:"#ff0302", correct_response:0, condition:4},
    {stim:"BLUE", stimcolor:"#ff0302", resp1:"BLUE", resp1color:"#ff0302", resp2:"RED", resp2color:"#0000FF", correct_response:1, condition:4}
  ];

  const stimuli_flanker = [
    {stim:al, stimsign:"<<<<<", resp1:ar, resp1sign:">>>>>", resp2:al, resp2sign:"<<<<<", correct_response:1, condition:1},
    {stim:al, stimsign:"<<<<<", resp1:al, resp1sign:"<<<<<", resp2:ar, resp2sign:">>>>>", correct_response:0, condition:1},
    {stim:ar, stimsign:">>>>>", resp1:ar, resp1sign:">>>>>", resp2:al, resp2sign:"<<<<<", correct_response:0, condition:1},
    {stim:ar, stimsign:">>>>>", resp1:al, resp1sign:"<<<<<", resp2:ar, resp2sign:">>>>>", correct_response:1, condition:1},
    {stim:al, stimsign:"<<<<<", resp1:ml_fr, resp1sign:">><>>", resp2:mr_fl, resp2sign:"<<><<", correct_response:0, condition:2},
    {stim:al, stimsign:"<<<<<", resp1:mr_fl, resp1sign:"<<><<", resp2:ml_fr, resp2sign:">><>>", correct_response:1, condition:2},
    {stim:ar, stimsign:">>>>>", resp1:ml_fr, resp1sign:">><>>", resp2:mr_fl, resp2sign:"<<><<", correct_response:1, condition:2},
    {stim:ar, stimsign:">>>>>", resp1:mr_fl, resp1sign:"<<><<", resp2:ml_fr, resp2sign:">><>>", correct_response:0, condition:2},
    {stim:mr_fl, stimsign:"<<><<", resp1:al, resp1sign:"<<<<<", resp2:ar, resp2sign:">>>>>", correct_response:0, condition:3},
    {stim:mr_fl, stimsign:"<<><<", resp1:ar, resp1sign:">>>>>", resp2:al, resp2sign:"<<<<<", correct_response:1, condition:3},
    {stim:ml_fr, stimsign:">><>>", resp1:al, resp1sign:"<<<<<", resp2:ar, resp2sign:">>>>>", correct_response:1, condition:3},
    {stim:ml_fr, stimsign:">><>>", resp1:ar, resp1sign:">>>>>", resp2:al, resp2sign:"<<<<<", correct_response:0, condition:3},
    {stim:mr_fl, stimsign:"<<><<", resp1:mr_fl, resp1sign:"<<><<", resp2:ml_fr, resp2sign:">><>>", correct_response:1, condition:4},
    {stim:mr_fl, stimsign:"<<><<", resp1:ml_fr, resp1sign:">><>>", resp2:mr_fl, resp2sign:"<<><<", correct_response:0, condition:4},
    {stim:ml_fr, stimsign:">><>>", resp1:mr_fl, resp1sign:"<<><<", resp2:ml_fr, resp2sign:">><>>", correct_response:0, condition:4},
    {stim:ml_fr, stimsign:">><>>", resp1:ml_fr, resp1sign:">><>>", resp2:mr_fl, resp2sign:"<<><<", correct_response:1, condition:4}
  ];

  const stimuli_simon = [
    {stim: larr, stimsign: "<", loc: "left", resp1: "LEFT", resp2: "RIGHT", correct_response: 0, condition:1},
    {stim: rarr, stimsign: ">", loc: "right", resp1: "LEFT", resp2: "RIGHT", correct_response: 1, condition:1},
    {stim: larr, stimsign: "<", loc: "left", resp1: "RIGHT", resp2: "LEFT", correct_response: 1, condition:2},
    {stim: rarr, stimsign: ">", loc: "right", resp1: "RIGHT", resp2: "LEFT", correct_response: 0, condition:2},
    {stim: larr, stimsign: "<", loc: "right", resp1: "LEFT", resp2: "RIGHT", correct_response: 0, condition:3},
    {stim: rarr, stimsign: ">", loc: "left", resp1: "LEFT", resp2: "RIGHT", correct_response: 1, condition:3},
    {stim: larr, stimsign: "<", loc: "right", resp1: "RIGHT", resp2: "LEFT", correct_response: 1, condition:4},
    {stim: rarr, stimsign: ">", loc: "left", resp1: "RIGHT", resp2: "LEFT", correct_response: 0, condition:4}
  ];

  // helper to create timed looping block (practice/main). Each block is its own object closure.
  function makeTimedTask(taskName, stimuliArray, practiceSampleSize, mainSampleSize, displayFn) {
    // create item pools
    const items = Array.from(Array(stimuliArray.length).keys());
    const practiceOrder = jsPsych.randomization.sampleWithReplacement(items, practiceSampleSize);
    const mainOrder = jsPsych.randomization.sampleWithReplacement(items, mainSampleSize);

    // function to create block for a given order
    function makeBlock(orderArray) {
      let trialIndex = 0;
      let blockStart = null;
      let endTimer = null;
      let timedOut = 0; // 0 normal, 1 timed out
      let totalScore = 0;
      let practiceFlag = 1;

      const trial = {
        type: jsPsychHtmlButtonResponse,
        stimulus: function(){ return displayFn(orderArray[trialIndex]); },
        choices: function(){ 
          // return two labels depending on the stimulus spec
          const s = stimuliArray[orderArray[trialIndex]];
          // if labels are images (flanker), return labels; displayFn will render images
          if(s.resp1 && s.resp2) return [s.resp1, s.resp2];
          return ['Option 1','Option 2'];
        },
        button_html: function(){
          // Use simple consistent buttons
          return ['<button class="choiceStyle">%choice%</button>','<button class="choiceStyle">%choice%</button>'];
        },
        on_start: function() {
          if(trialIndex === 0) {
            const dur = practiceFlag ? PRACTICE_MS : MAIN_MS;
            blockStart = Date.now();
            timedOut = 0;
            endTimer = setTimeout(function(){
              timedOut = 1;
              trialIndex = 0;
              // end current looping timeline
              jsPsych.endCurrentTimeline();
            }, dur);
          }
        },
        on_load: function(){ countdown_local(blockStart, (practiceFlag ? PRACTICE_MS : MAIN_MS)); },
        on_finish: function(data){
          data.task = taskName;
          data.practice = practiceFlag;
          data.item = orderArray[trialIndex];
          // attempt to attach stimulus-specific metadata (best-effort)
          const spec = stimuliArray[orderArray[trialIndex]];
          for(const k in spec) { if(['resp1','resp2'].indexOf(k) === -1) data[k] = spec[k]; }
          // determine accuracy if spec.correct_response is available
          if(spec.correct_response !== undefined) data.correct_response = spec.correct_response;
          data.accuracy = (data.response !== null && spec.correct_response !== undefined) ? (data.response == spec.correct_response ? 1 : 0) : null;
          data.timeout = timedOut;
          if(timedOut === 0 && data.accuracy !== null) totalScore = data.accuracy == 1 ? totalScore + 1 : totalScore - 1;
          data.score_after_trial = totalScore;
        }
      };

      const feedback = {
        type: jsPsychHtmlButtonResponse,
        stimulus: function(){ return displayFn(orderArray[trialIndex]); },
        choices: function(){ 
          const s = stimuliArray[orderArray[trialIndex]];
          return s.resp1 && s.resp2 ? [s.resp1, s.resp2] : ['Option 1','Option 2'];
        },
        button_html: function() {
          const last = jsPsych.data.get().last(1).values()[0] || {};
          const resp = last.response;
          const correct = last.correct_response;
          let f1 = '<div style="height:20px;"></div>', f2 = '<div style="height:20px;"></div>';
          if(resp === 0) f1 = correct == 0 ? '<div style="color:#1ED760">&#10004;</div>' : '<div style="color:red">&#10008;</div>';
          if(resp === 1) f2 = correct == 1 ? '<div style="color:#1ED760">&#10004;</div>' : '<div style="color:red">&#10008;</div>';
          return ['<button class="choiceStyle">'+f1+'%choice%</button>', '<button class="choiceStyle">'+f2+'%choice%</button>'];
        },
        on_start: function(){ trialIndex++; },
        trial_duration: 500,
        response_ends_trial: false
      };

      const loop = { timeline: [trial, feedback], loop_function: function(){ return true; } };
      loop.setPracticeFlag = function(v){ practiceFlag = v; };
      loop.getTotal = function(){ return totalScore; };
      loop.clearTimer = function(){ if(endTimer) { clearTimeout(endTimer); endTimer = null; } };
      return loop;
    } // end makeBlock

    const practiceBlock = makeBlock(practiceOrder); practiceBlock.setPracticeFlag(1);
    const mainBlock = makeBlock(mainOrder); mainBlock.setPracticeFlag(0);

    // instruction screens
    const instrPractice = { type: jsPsychHtmlButtonResponse, stimulus:`<div class="centered"><h3>${taskName.toUpperCase()} — Practice</h3><p>Practice instructions: respond quickly and accurately. Practice duration: 30s.</p></div>`, choices: ["Begin practice"] };
    const prepPractice = { type: jsPsychHtmlButtonResponse, stimulus:`<div class="centered"><p>Ready to start practice?</p></div>`, choices: ["Start practice"] };
    const instrMain = { type: jsPsychHtmlButtonResponse, stimulus:`<div class="centered"><h3>${taskName.toUpperCase()} — Main</h3><p>Main instructions: keep responding. Main duration: 90s.</p></div>`, choices: ["I understand"] };
    const prepMain = { type: jsPsychHtmlButtonResponse, stimulus:`<div class="centered"><p>Start main block?</p></div>`, choices: ["Start task"] };

    const conclusion = {
      type: jsPsychHtmlButtonResponse,
      stimulus: function(){ return `<div class="centered"><p>You completed ${taskName} practice + main.</p><p>Click Continue.</p></div>`; },
      choices: ["Continue"],
      on_start: function(){
        // compute aggregated metrics and attach to relevant rows
        try {
          jsPsych.data.get().filter({ task: taskName, practice: 1 }).addToAll({
            score_final: jsPsych.data.get().filter({ task: taskName, practice: 1, timeout: 0 }).last(1).values()[0] ? jsPsych.data.get().filter({ task: taskName, practice: 1, timeout: 0 }).last(1).values()[0].score_after_trial : '',
            meanrt_final: jsPsych.data.get().filter({ task: taskName, practice: 1, timeout: 0 }).select('rt').mean() || ''
          });
          jsPsych.data.get().filter({ task: taskName, practice: 0 }).addToAll({
            score_final: jsPsych.data.get().filter({ task: taskName, practice: 0, timeout: 0 }).last(1).values()[0] ? jsPsych.data.get().filter({ task: taskName, practice: 0, timeout: 0 }).last(1).values()[0].score_after_trial : '',
            meanrt_final: jsPsych.data.get().filter({ task: taskName, practice: 0, timeout: 0 }).select('rt').mean() || ''
          });
        } catch(e) { console.warn('Summary attach error for', taskName, e); }
      }
    };

    return [instrPractice, prepPractice, practiceBlock, instrMain, prepMain, mainBlock, conclusion];
  } // end makeTimedTask

  // Create stroop/flanker/simon timelines using factories
  function display_stroop(idx){ const s = stimuli_stroop[idx]; return `<div style='font-size:10pt;display:flex;align-items:center;'>Time left<div id='countdownbar' style='margin:0 12px;'><div id='timeleft'></div></div><span style='font-size:54pt;font-weight:900;color:${s.stimcolor}'>${s.stim}</span></div>`; }
  function display_flanker(idx){ const s = stimuli_flanker[idx]; return `<div style='display:flex;align-items:center;'>Time left<div id='countdownbar' style='margin:0 12px;'><div id='timeleft'></div></div><img src='${s.stim}' width='290'></div>`; }
  function display_simon(idx){ const s = stimuli_simon[idx]; return `<div style='display:flex;align-items:center;'><div style='margin-right:12px;'>Time left<div id='countdownbar' style='margin:0 12px;'><div id='timeleft'></div></div></div><span style='display:flex;justify-content:${s.loc};'><img src='${s.stim}' height='70'></span></div>`; }

  const stroopSeq = makeTimedTask('stroop', stimuli_stroop, 100, 500, display_stroop);
  const flankerSeq = makeTimedTask('flanker', stimuli_flanker, 100, 500, display_flanker);
  const simonSeq = makeTimedTask('simon', stimuli_simon, 100, 500, display_simon);

  // preload images and dynamic css load/unload
  const preload = { type: jsPsychPreload, images: [al, ar, ml_fr, mr_fl, rarr, larr] };
  let cssLink = null;
  const loadCssTrial = { type: jsPsychHtmlKeyboardResponse, stimulus:'', choices: "NO_KEYS", trial_duration: 10, on_start: function(){ cssLink = loadCSS('squared/squared.css'); console.log('DEBUG: loaded squared.css'); } };
  const unloadCssTrial = { type: jsPsychHtmlKeyboardResponse, stimulus:'', choices: "NO_KEYS", trial_duration: 10, on_finish: function(){ unloadCSS(cssLink); console.log('DEBUG: unloaded squared.css'); } };

  // return concatenated timeline (load CSS -> preload -> tasks -> unload CSS)
  return [ loadCssTrial, preload, ...stroopSeq, ...flankerSeq, ...simonSeq, unloadCssTrial ];
} // end getSquaredTimeline

/**************** FINAL SCREEN ****************/
const finalScreen = {
  type: jsPsychHtmlButtonResponse,
  stimulus: `<div class="centered" style="text-align:center;"><p><strong>Thank you!</strong></p><p>Click continue to return to Qualtrics.</p></div>`,
  choices: ['Continue'],
  on_finish: function(){
    const payload = buildSummaryPayload();
    const params = new URLSearchParams(window.location.search);
    const q = new URLSearchParams({ PROLIFIC_PID: params.get('PROLIFIC_PID')||'', STUDY_ID: params.get('STUDY_ID')||'', SESSION_ID: params.get('SESSION_ID')||'', version: VERSION, ...payload });
    window.location.href = `${QUALTRICS_RETURN_URL}?${q.toString()}`;
  }
};

/**************** BUILD TIMELINE & RUN ****************/
const timeline = [];
timeline.push(intro1, intro2);
for(let i=0;i<4;i++){ timeline.push(makeRound1Trial(i)); timeline.push(incorrectFeedback); }
timeline.push(breakScreen, round2Intro);
for(let i=0;i<4;i++){ timeline.push(makeRound2Trial(i)); }

// Insert squared timeline exactly once between Round 2 and Round 3
timeline.push(...getSquaredTimeline());

timeline.push(round3Intro);
for(let i=0;i<4;i++){ timeline.push(makeRound3Trial(i)); timeline.push(positiveFeedback); }
timeline.push(break2Screen);
timeline.push(round4Intro);
for(let i=0;i<4;i++){ timeline.push(makeRound4Trial(i)); }

timeline.push(finalScreen);

/* Debug trial to ensure jsPsych started and the display has focus */
const debugTrial = {
  type: jsPsychHtmlButtonResponse,
  stimulus: `<div class="centered"><p style="font-size:20px;"><strong>DEBUG: jsPsych started</strong></p><p>If you see this, jsPsych is running.</p><p>Click Continue to proceed.</p></div>`,
  choices: ['Continue'],
  button_html: '<button class="jspsych-btn">%choice%</button>',
  on_start: function(){ const t = document.getElementById('jspsych-target'); if(t && t.focus) { t.focus(); console.log('DEBUG: focused jspsych-target'); } console.log('DEBUG: debugTrial on_start'); },
  on_finish: function(){ console.log('DEBUG: debugTrial on_finish'); }
};
timeline.unshift(debugTrial);

const targetEl = document.getElementById('jspsych-target');
if(targetEl && targetEl.focus) { targetEl.focus(); console.log('DEBUG: focused jspsych-target before run'); }

console.log('DEBUG: running timeline');
jsPsych.run(timeline);
</script>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>LFF Task — Parent (CDN jsPsych, iframe squared)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- jsPsych core CSS + core (CDN) -->
  <link href="https://unpkg.com/jspsych@7.3.1/css/jspsych.css" rel="stylesheet" type="text/css">
  <script src="https://unpkg.com/jspsych@7.3.1"></script>

  <!-- Plugins used by the parent experiment (CDN) -->
  <script src="https://unpkg.com/@jspsych/plugin-preload@1.1.2"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.2"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.1.2"></script>
  <script src="https://unpkg.com/@jspsych/plugin-fullscreen@1.1.2"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-text@1.1.2"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-multi-choice@1.1.2"></script>
  <script src="https://unpkg.com/@jspsych/plugin-call-function@1.1.2"></script>

  <style>
    body { background:#fafafa; font-family: Arial, sans-serif; color:#111; }
    .centered { max-width:900px; margin:0 auto; padding:24px; line-height:1.45; }
    .question-title { font-size:22px; font-weight:600; margin-bottom:16px; }
    .choice-img { max-width:360px; max-height:320px; border:2px solid #ddd; border-radius:6px; }
    .incorrect-banner { font-size:30px; font-weight:700; color:#b00020; text-align:center; margin:16px 0 24px; }
    .feedback-banner { font-size:30px; font-weight:700; color:#006400; text-align:center; margin:16px 0 24px; }
    .break-box { display:flex; gap:24px; align-items:flex-start; justify-content:space-between; flex-wrap:wrap; margin-top:10px; }
    textarea#music, textarea#writing { width:100%; min-height:160px; font-size:16px; padding:12px; border:2px solid #ccc; border-radius:6px; resize:vertical; }
    .countdown { flex:0 0 220px; font-size:18px; border:2px solid #ccc; border-radius:6px; padding:12px; height:56px; display:flex; align-items:center; justify-content:center; background:#fff; }
    iframe.squared-frame { width:100%; height:760px; border:0; }
  </style>
</head>
<body>
  <div id="jspsych-target" tabindex="0"></div>

<script>
// Global error handlers
window.addEventListener('error', e => console.error('GLOBAL ERROR:', e.message, e.filename + ':' + e.lineno));
window.addEventListener('unhandledrejection', e => console.error('UNHANDLED PROMISE REJECTION:', e.reason));

console.log('Starting experiment script...');

/**************** CONFIG ****************/
const VERSION = "v1";
const ROUND2_CORRECT_RULE = "same";
const BREAK_SECONDS = 120;
const QUALTRICS_RETURN_URL = "https://merceruniversity.co1.qualtrics.com/jfe/form/SV_eEG4o0S1x2n2DFI";

/**************** INIT ****************/
window.jsPsych = initJsPsych({ display_element: 'jspsych-target' });
window._jsPsychInstance = window.jsPsych;
jsPsych.data.addProperties({ version: VERSION });

/**************** DYNAMIC CSS HELPERS (kept for completeness) ****************/
function loadCSS(href){
  const link = document.createElement('link');
  link.rel = 'stylesheet';
  link.href = href;
  document.head.appendChild(link);
  return link;
}
function unloadCSS(link){
  if(link && link.parentNode) link.parentNode.removeChild(link);
}

/**************** PAYLOAD BUILDER ****************/
function buildSummaryPayload() {
  const all = jsPsych.data.get().values();

  const filterByRound = r => all.filter(d => d.round === r);
  const r1 = filterByRound(1), r2 = filterByRound(2), r3 = filterByRound(3), r4 = filterByRound(4);

  const joinChoices = arr => arr.map(d => d.choice_label || '').join(',');
  const r1_choices = joinChoices(r1), r2_choices = joinChoices(r2), r3_choices = joinChoices(r3), r4_choices = joinChoices(r4);

  const joinRT = arr => arr.map(d => d.rt || '').join(',');
  const rt_r1 = joinRT(r1), rt_r2 = joinRT(r2), rt_r3 = joinRT(r3), rt_r4 = joinRT(r4);

  const sumCounts = arr => arr.map(d => Number(d.correct || 0)).reduce((a,b)=>a+b,0);

  function getTaskSummary(taskName){
    try {
      const mainFilter = jsPsych.data.get().filter({ task: taskName, practice: 0, timeout: 0 });
      const lastRow = mainFilter.last(1).values()[0] || {};
      return {
        score_final: lastRow.score_final || lastRow.score_after_trial || '',
        meanrt_final: mainFilter.select('rt').mean() || ''
      };
    } catch (e) { return { score_final:'', meanrt_final: '' }; }
  }

  const stroop = getTaskSummary('stroop');
  const flanker = getTaskSummary('flanker');
  const simon = getTaskSummary('simon');

  const br = all.find(d => d.favorite_music !== undefined);
  const music_short = br ? (br.favorite_music || '').slice(0,150) : '';
  const br2 = all.find(d => d.favorite_writing !== undefined);
  const writing_short = br2 ? (br2.favorite_writing || '').slice(0,150) : '';
  const readingRow = all.find(d => d.reading_time !== undefined);
  const reading_time = readingRow ? readingRow.reading_time : '';

  return {
    r1_choices, r2_choices, r3_choices, r4_choices,
    r2_correct: r2.map(d => d.correct || 0).join(','), r2_total: String(sumCounts(r2)),
    r3_correct: r3.map(d => d.correct || 0).join(','), r3_total: String(sumCounts(r3)),
    r4_correct: r4.map(d => d.correct || 0).join(','), r4_total: String(sumCounts(r4)),
    rt_r1, rt_r2, rt_r3, rt_r4,
    music_short, writing_short, reading_time,
    stroop_score: String(stroop.score_final || ''), stroop_meanrt: String(stroop.meanrt_final || ''),
    flanker_score: String(flanker.score_final || ''), flanker_meanrt: String(flanker.meanrt_final || ''),
    simon_score: String(simon.score_final || ''), simon_meanrt: String(simon.meanrt_final || '')
  };
}

/**************** CORE TASK UI ****************/
/* -- DATA / helper content -- */
const round1Questions = [
  { pair:1, prompt:"Question #1. Which of the following characters in an ancient script represents an animal?" },
  { pair:2, prompt:"Question #2. Which of the following characters in an ancient script represents a person?" },
  { pair:3, prompt:"Question #3. Which of the following characters in an ancient script represents a bird?" },
  { pair:4, prompt:"Question #4. Which of the following characters in an ancient script represents a rodent?" }
];
const round2Questions = [
  "Question #1. Which of the following characters represents a non-living stationary object?",
  "Question #2. Which of the following characters represents a non-living stationary object?",
  "Question #3. Which of the following characters represents a non-living stationary object?",
  "Question #4. Which of the following characters represents a non-living stationary object?"
];
const round3Questions = [
  "Round 3 - Question #1. Please select the image that matches the new instruction.",
  "Round 3 - Question #2. Please select the image that matches the new instruction.",
  "Round 3 - Question #3. Please select the image that matches the new instruction.",
  "Round 3 - Question #4. Please select the image that matches the new instruction."
];
const round4Questions = [
  "Round 4 - Question #1. Which image did you pick earlier in Round 3 for Pair 1?",
  "Round 4 - Question #2. Which image did you pick earlier in Round 3 for Pair 2?",
  "Round 4 - Question #3. Which image did you pick earlier in Round 3 for Pair 3?",
  "Round 4 - Question #4. Which image did you pick earlier in Round 3 for Pair 4?"
];

const imagePairs = [
  { A:"img/Pair 1 Image A.png", B:"img/Pair 1 Image B.png" },
  { A:"img/Pair 2 Image A.png", B:"img/Pair 2 Image B.png" },
  { A:"img/Pair 3 Image A.png", B:"img/Pair 3 Image B.png" },
  { A:"img/Pair 4 Image A.png", B:"img/Pair 4 Image B.png" }
];
const imagePairsRound3 = [
  { A:"img/R3 Pair 1 A.png", B:"img/R3 Pair 1 B.png" },
  { A:"img/R3 Pair 2 A.png", B:"img/R3 Pair 2 B.png" },
  { A:"img/R3 Pair 3 A.png", B:"img/R3 Pair 3 B.png" },
  { A:"img/R3 Pair 4 A.png", B:"img/R3 Pair 4 B.png" }
];

const round1Choices = [null,null,null,null];
const round3Choices = [null,null,null,null];
const round3Answers = [null,null,null,null];

function imgChoice(src, alt) { return `<img class="choice-img" src="${src}" alt="${alt}">`; }

/* Intro screens */
const intro1 = {
  type: jsPsychHtmlKeyboardResponse,
  stimulus: `<div class="centered"><p>Welcome! Today you will answer some language questions about a researcher-manufactured ancient script.</p><p style="text-align:center;"><strong>Press space to continue.</strong></p></div>`,
  choices: [' ']
};
const intro2 = {
  type: jsPsychHtmlKeyboardResponse,
  stimulus: `<div class="centered"><p>Learning from failure requires attention. Press space to begin Round 1.</p></div>`,
  choices: [' '],
  on_finish: d => d.reading_time = d.rt
};

/* Round 1 */
function makeRound1Trial(i){
  const pair = imagePairs[i];
  const q = round1Questions[i];
  return {
    type: jsPsychHtmlButtonResponse,
    stimulus: `<div class="centered"><div class="question-title">${q.prompt}</div></div>`,
    choices: [imgChoice(pair.A,"A"), imgChoice(pair.B,"B")],
    data: { round: 1 },
    on_finish: function(d){
      const c = (d.response===0) ? "A" : "B";
      d.choice_label = c; d.chosen_image = (d.response===0) ? pair.A : pair.B; round1Choices[i] = c;
    }
  };
}

const incorrectFeedback = {
  type: jsPsychHtmlKeyboardResponse,
  stimulus: `<div class="centered"><div class="incorrect-banner">YOU ANSWERED THIS QUESTION INCORRECT!</div><div class="press-space">Press space to continue.</div></div>`,
  choices: [' ']
};

/* Break 1 */
const breakScreen = {
  type: jsPsychHtmlButtonResponse,
  stimulus: `
    <div class="centered">
      <p>Take a short breather.</p>
      <p><strong>What is your favorite music to listen to?</strong></p>
      <div class="break-box">
        <div style="flex:1;"><textarea id="music" placeholder="Type here..."></textarea></div>
        <div class="countdown" id="countdown">2:00</div>
      </div>
    </div>`,
  choices: ['Submit'],
  button_html: '<button class="jspsych-btn" type="button" disabled>%choice%</button>',
  on_load: function(){
    const btn = document.querySelector('.jspsych-html-button-response-button button');
    const el = document.getElementById('countdown');
    let total = BREAK_SECONDS;
    el.textContent = `${Math.floor(total/60)}:${String(total%60).padStart(2,'0')}`;
    this._interval = setInterval(()=>{
      total--; el.textContent = `${Math.floor(Math.max(total,0)/60)}:${String(Math.max(total,0)%60).padStart(2,'0')}`;
      if(total<=0){ clearInterval(this._interval); btn.disabled=false; }
    },1000);
  },
  on_finish: function(d){ if(this._interval) clearInterval(this._interval); const txt = document.getElementById('music'); d.favorite_music = txt ? txt.value : ''; }
};

/* Round 2 */
const round2Intro = { type: jsPsychHtmlKeyboardResponse, stimulus: `<div class="centered"><p><strong>This is Round 2.</strong></p><p>Press space to begin.</p></div>`, choices: [' '] };

function makeRound2Trial(i){
  const pair = imagePairs[i];
  return {
    type: jsPsychHtmlButtonResponse,
    stimulus: `<div class="centered"><div class="question-title">${round2Questions[i]}</div></div>`,
    choices: [imgChoice(pair.A,"A"), imgChoice(pair.B,"B")],
    data: { round: 2 },
    on_finish: function(d){
      const choiceLabel = (d.response===0) ? "A" : "B";
      const r1Choice = round1Choices[i];
      const correct = (ROUND2_CORRECT_RULE === 'different') ? (choiceLabel !== r1Choice) : (choiceLabel === r1Choice);
      d.choice_label = choiceLabel; d.chosen_image = (d.response===0) ? pair.A : pair.B;
      d.round1_choice_for_pair = r1Choice; d.correct = correct ? 1 : 0;
    }
  };
}

/* Round 3 & 4 */
const round3Intro = { type: jsPsychHtmlKeyboardResponse, stimulus: `<div class="centered"><p><strong>This is Round 3.</strong></p><p>Press space to begin.</p></div>`, choices: [' '] };

function makeRound3Trial(i){
  const pair = imagePairsRound3[i];
  return {
    type: jsPsychHtmlButtonResponse,
    stimulus: `<div class="centered"><div class="question-title">${round3Questions[i]}</div></div>`,
    choices: [imgChoice(pair.A,"A"), imgChoice(pair.B,"B")],
    data: { round: 3 },
    on_finish: function(d){
      const c = (d.response===0) ? "A" : "B"; d.choice_label = c; d.chosen_image = (d.response===0) ? pair.A : pair.B; round3Choices[i] = c;
      const key = round3Answers[i]; d.correct = (key === 'A' || key === 'B') ? (c === key ? 1 : 0) : null;
    }
  };
}

const positiveFeedback = { type: jsPsychHtmlKeyboardResponse, stimulus: `<div class="centered"><div class="feedback-banner">YOU ANSWERED THIS QUESTION CORRECT!</div><div class="press-space">Press space to continue.</div></div>`, choices: [' '] };

const break2Screen = {
  type: jsPsychHtmlButtonResponse,
  stimulus: `
    <div class="centered">
      <p>Write briefly about a recent experience you enjoyed.</p>
      <div class="break-box">
        <div style="flex:1;"><textarea id="writing" placeholder="Type here..."></textarea></div>
        <div class="countdown" id="countdown2">2:00</div>
      </div>
    </div>`,
  choices: ['Submit'],
  button_html: '<button class="jspsych-btn" type="button" disabled>%choice%</button>',
  on_load: function(){
    const btn = document.querySelector('.jspsych-html-button-response-button button');
    const el = document.getElementById('countdown2'); let total = BREAK_SECONDS; el.textContent = `${Math.floor(total/60)}:${String(total%60).padStart(2,'0')}`;
    this._interval = setInterval(()=>{ total--; el.textContent = `${Math.floor(Math.max(total,0)/60)}:${String(Math.max(total,0)%60).padStart(2,'0')}`; if(total<=0){ clearInterval(this._interval); btn.disabled=false; } },1000);
  },
  on_finish: function(d){ if(this._interval) clearInterval(this._interval); const txt = document.getElementById('writing'); d.favorite_writing = txt ? txt.value : ''; }
};

const round4Intro = { type: jsPsychHtmlKeyboardResponse, stimulus: `<div class="centered"><p><strong>This is Round 4 (Recall).</strong></p><p>Press space to begin.</p></div>`, choices: [' '] };

function makeRound4Trial(i){
  const pair = imagePairsRound3[i];
  return {
    type: jsPsychHtmlButtonResponse,
    stimulus: `<div class="centered"><div class="question-title">${round4Questions[i]}</div></div>`,
    choices: [imgChoice(pair.A,"A"), imgChoice(pair.B,"B")],
    data: { round: 4 },
    on_finish: function(d){ const c = (d.response===0) ? "A" : "B"; d.choice_label = c; d.chosen_image = (d.response===0) ? pair.A : pair.B; d.correct = (c === round3Choices[i]) ? 1 : 0; d.round3_choice_for_pair = round3Choices[i]; }
  };
}

/**************** SQUARED IFRAME TRIAL ****************/
function getSquaredTimeline() {
  const trial = {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: `<div class="centered" style="padding:0;"><iframe id="squared-iframe" class="squared-frame" src="squared/squared.html" title="Squared task"></iframe></div>`,
    choices: "NO_KEYS",
    trial_duration: null,
    on_start: function() {
      console.log('DEBUG: squared iframe trial started; waiting for postMessage from iframe');

      function onMessage(e) {
        // Accept same-origin messages; during local testing many dev setups use same-origin.
        try {
          if (e.origin !== window.location.origin) {
            console.warn('Message from unexpected origin:', e.origin);
            // allow for local testing; do not return here when using local dev server on same origin
            // return;
          }
        } catch (err) {
          console.warn('Origin check failed (continuing for local test):', err);
        }

        const msg = e.data;
        if (!msg || msg.type !== 'squared_done') return;
        console.log('DEBUG: received squared_done message from iframe', msg);

        const payload = {
          task: 'squared',
          stroop_summary: msg.stroopSummary || {},
          flanker_summary: msg.flankerSummary || {},
          simon_summary: msg.simonSummary || {},
          raw: msg.raw || null
        };

        jsPsych.finishTrial(payload);
        window.removeEventListener('message', onMessage);
      }

      window.addEventListener('message', onMessage, false);

      setTimeout(function(){
        const iframe = document.getElementById('squared-iframe');
        try { iframe && iframe.contentWindow && iframe.contentWindow.focus(); } catch(e) {}
      }, 200);
    }
  };

  return [trial];
}

/**************** FINAL SCREEN ****************/
const finalScreen = {
  type: jsPsychHtmlButtonResponse,
  stimulus: `<div class="centered" style="text-align:center;"><p><strong>Thank you!</strong></p><p>Click continue to return to Qualtrics.</p></div>`,
  choices: ['Continue'],
  on_finish: function(){
    const payload = buildSummaryPayload();
    const params = new URLSearchParams(window.location.search);
    const q = new URLSearchParams({
      PROLIFIC_PID: params.get('PROLIFIC_PID') || '',
      STUDY_ID: params.get('STUDY_ID') || '',
      SESSION_ID: params.get('SESSION_ID') || '',
      version: VERSION,
      ...payload
    });
    window.location.href = `${QUALTRICS_RETURN_URL}?${q.toString()}`;
  }
};

/**************** BUILD TIMELINE & RUN ****************/
const timeline = [];
timeline.push(intro1, intro2);
for(let i=0;i<4;i++){ timeline.push(makeRound1Trial(i)); timeline.push(incorrectFeedback); }
timeline.push(breakScreen, round2Intro);
for(let i=0;i<4;i++){ timeline.push(makeRound2Trial(i)); }
timeline.push(...getSquaredTimeline());
timeline.push(round3Intro);
for(let i=0;i<4;i++){ timeline.push(makeRound3Trial(i)); timeline.push(positiveFeedback); }
timeline.push(break2Screen);
timeline.push(round4Intro);
for(let i=0;i<4;i++){ timeline.push(makeRound4Trial(i)); }
timeline.push(finalScreen);

/* Debug trial */
const debugTrial = {
  type: jsPsychHtmlButtonResponse,
  stimulus: `<div class="centered"><p style="font-size:20px;"><strong>DEBUG: jsPsych started</strong></p><p>If you see this, jsPsych is running.</p><p>Click Continue.</p></div>`,
  choices: ['Continue'],
  on_start: function(){ const t = document.getElementById('jspsych-target'); if (t && t.focus) { t.focus(); console.log('DEBUG: focused jspsych-target'); } },
  on_finish: function(){ console.log('DEBUG: debugTrial finished'); }
};
timeline.unshift(debugTrial);

console.log('DEBUG: running timeline (parent index.html)');
jsPsych.run(timeline);
</script>
</body>
</html>

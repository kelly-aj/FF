<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>LFF Task — Version 2</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" href="jspsych/jspsych.css" />
  <script src="jspsych/jspsych.js"></script>
  <script src="jspsych/plugin-preload.js"></script>
  <script src="jspsych/plugin-html-keyboard-response.js"></script>
  <script src="jspsych/plugin-html-button-response.js"></script>

  <style>
    body { background:#fafafa; font-family: Arial, sans-serif; color:#111; }
    .centered { max-width:900px; margin:0 auto; padding:24px; line-height:1.45; }
    .question-title { font-size:22px; font-weight:600; margin-bottom:16px; }
    .choice-img { max-width:360px; max-height:320px; border:2px solid #ddd; border-radius:6px; }
    .vertical-btn { display:block; width:700px; max-width:90%; margin:10px auto; text-align:left; padding:12px; }
    .incorrect-banner { font-size:30px; font-weight:700; color:#b00020; text-align:center; margin:16px 0 24px; }
    .feedback-banner { font-size:30px; font-weight:700; color:#006400; text-align:center; margin:16px 0 24px; }
    .press-space { text-align:center; margin-top:24px; }
    .break-box { display:flex; gap:24px; align-items:flex-start; justify-content:space-between; flex-wrap:wrap; margin-top:10px; }
    textarea#music, textarea#writing { width:100%; min-height:160px; font-size:16px; padding:12px; border:2px solid #ccc; border-radius:6px; resize:vertical; }
    .countdown { flex:0 0 220px; font-size:18px; border:2px solid #ccc; border-radius:6px; padding:12px; height:56px; display:flex; align-items:center; justify-content:center; background:#fff; }
  </style>
</head>
<body>
<div id="jspsych-target"></div>

<script>
/**************** CONFIG ****************/
const VERSION = "v2";
const BREAK_SECONDS = 120;
const QUALTRICS_RETURN_URL = "https://merceruniversity.co1.qualtrics.com/jfe/form/SV_eEG4o0S1x2n2DFI";

/**************** INIT ****************/
const jsPsych = initJsPsych({ display_element: 'jspsych-target' });
jsPsych.data.addProperties({ version: VERSION });

/**************** SUMMARY PAYLOAD ****************/
function buildSummaryPayload() {
  const all = jsPsych.data.get().values();
  const byRound = round => all.filter(d => d.round === round);
  const r1 = byRound(1), r2 = byRound(2), r3 = byRound(3), r4 = byRound(4);
  const choices = rows => rows.map(d => d.choice_label || '').join(',');
  const reactionTimes = rows => rows.map(d => d.rt || '').join(',');
  const correctTotal = rows => rows.reduce((sum, d) => sum + Number(d.correct || 0), 0);
  const musicRow = all.find(d => d.favorite_music !== undefined);
  const writingRow = all.find(d => d.favorite_writing !== undefined);
  const readingRow = all.find(d => d.reading_time !== undefined);
  const compRow = all.find(d => d.screen === 'comprehension');

  return {
    r1_choices: choices(r1), r2_choices: choices(r2),
    r3_choices: choices(r3), r4_choices: choices(r4),
    r2_correct: r2.map(d => d.correct || 0).join(','), r2_total: String(correctTotal(r2)),
    r3_correct: r3.map(d => d.correct ?? '').join(','), r3_total: String(correctTotal(r3)),
    r4_correct: r4.map(d => d.correct || 0).join(','), r4_total: String(correctTotal(r4)),
    rt_r1: reactionTimes(r1), rt_r2: reactionTimes(r2),
    rt_r3: reactionTimes(r3), rt_r4: reactionTimes(r4),
    music_short: musicRow ? (musicRow.favorite_music || '').slice(0, 150) : '',
    writing_short: writingRow ? (writingRow.favorite_writing || '').slice(0, 150) : '',
    reading_time: readingRow ? readingRow.reading_time : '',
    comp_correct: compRow ? compRow.correct : ''
  };
}

/**************** TASK DATA ****************/
const round1Questions = [
  { prompt:"Question #1. Which of the following characters in an ancient script represents an animal?" },
  { prompt:"Question #2. Which of the following characters in an ancient script represents a person?" },
  { prompt:"Question #3. Which of the following characters in an ancient script represents a bird?" },
  { prompt:"Question #4. Which of the following characters in an ancient script represents a rodent?" }
];
const round2Questions = [
  "Question #1. Which of the following characters represents a non-living stationary object?",
  "Question #2. Which of the following characters represents a non-living stationary object?",
  "Question #3. Which of the following characters represents a non-living stationary object?",
  "Question #4. Which of the following characters represents a non-living stationary object?"
];
const round3Questions = [
  "Round 3 - Question #1. Please select the image that matches the new instruction.",
  "Round 3 - Question #2. Please select the image that matches the new instruction.",
  "Round 3 - Question #3. Please select the image that matches the new instruction.",
  "Round 3 - Question #4. Please select the image that matches the new instruction."
];
const round4Questions = [
  "Round 4 - Question #1. Which image did you pick earlier in Round 3 for Pair 1?",
  "Round 4 - Question #2. Which image did you pick earlier in Round 3 for Pair 2?",
  "Round 4 - Question #3. Which image did you pick earlier in Round 3 for Pair 3?",
  "Round 4 - Question #4. Which image did you pick earlier in Round 3 for Pair 4?"
];
const imagePairs = [
  { A:"img/Pair 1 Image A.png", B:"img/Pair 1 Image B.png" },
  { A:"img/Pair 2 Image A.png", B:"img/Pair 2 Image B.png" },
  { A:"img/Pair 3 Image A.png", B:"img/Pair 3 Image B.png" },
  { A:"img/Pair 4 Image A.png", B:"img/Pair 4 Image B.png" }
];
const imagePairsRound3 = [
  { A:"img/R3 Pair 1 A.png", B:"img/R3 Pair 1 B.png" },
  { A:"img/R3 Pair 2 A.png", B:"img/R3 Pair 2 B.png" },
  { A:"img/R3 Pair 3 A.png", B:"img/R3 Pair 3 B.png" },
  { A:"img/R3 Pair 4 A.png", B:"img/R3 Pair 4 B.png" }
];
const round1Choices = [null, null, null, null];
const round3Choices = [null, null, null, null];
// v1 does not define an answer key for Round 3; retain that behavior in v2.
const round3Answers = [null, null, null, null];

function imgChoice(src, alt) { return `<img class="choice-img" src="${src}" alt="${alt}">`; }

/**************** INTRO AND COMPREHENSION ****************/
const intro1 = {
  type: jsPsychHtmlKeyboardResponse,
  stimulus: `<div class="centered"><p>Welcome! Today you will answer questions about researcher-manufactured ancient scripts.</p><p style="text-align:center;"><strong>Press space to continue.</strong></p></div>`,
  choices: [' ']
};
const intro2 = {
  type: jsPsychHtmlKeyboardResponse,
  stimulus: `<div class="centered">
    <p>People use a variety of strategies to stay focused during everyday activities. Some individuals prefer quiet environments, while others find that background noise or music helps them concentrate.</p>
    <p>People also differ in how they keep track of information, with some relying on mental notes and others using written reminders or digital tools. Factors such as lighting, time of day, and personal preferences can affect how people approach tasks.</p>
    <p>As you complete the next task, simply continue in whatever way feels natural to you.</p>
    <p style="text-align:center;"><strong>Press space to continue.</strong></p>
  </div>`,
  choices: [' '],
  on_finish: d => d.reading_time = d.rt
};
let compOptions = [];
const comprehensionCheck = {
  type: jsPsychHtmlButtonResponse,
  stimulus: `<div class="centered"><div class="question-title">According to the paragraph, how are people described as staying focused during everyday activities?</div></div>`,
  data: { screen: 'comprehension' },
  on_start: function() {
    compOptions = jsPsych.randomization.shuffle([
      { text:"Most people rely solely on digital tools to stay focused.", value:"A" },
      { text:"People use different strategies, such as choosing certain environments or using reminders.", value:"B" },
      { text:"Everyone concentrates best only in quiet environments.", value:"C" },
      { text:"Lighting and time of day do not affect how people approach tasks.", value:"D" }
    ]);
    this.choices = compOptions.map(option => option.text);
  },
  button_html: `<button class="vertical-btn">%choice%</button>`,
  on_finish: d => { d.correct = compOptions[d.response].value === "B" ? 1 : 0; }
};

/**************** ROUNDS 3 AND 4 (FIRST) ****************/
const round3Intro = {
  type: jsPsychHtmlKeyboardResponse,
  stimulus: `<div class="centered"><p>We are now going to complete the first two rounds of the ancient-script task.</p><p>In Round 3, select the image that matches the new instruction. Try to learn from the questions; Round 4 will ask you to remember your selections.</p><p style="text-align:center;"><strong>Press space to begin.</strong></p></div>`,
  choices: [' ']
};
function makeRound3Trial(i) {
  const pair = imagePairsRound3[i];
  return {
    type: jsPsychHtmlButtonResponse,
    stimulus: `<div class="centered"><div class="question-title">${round3Questions[i]}</div></div>`,
    choices: [imgChoice(pair.A, "A"), imgChoice(pair.B, "B")],
    data: { round: 3 },
    on_finish: d => {
      const choice = d.response === 0 ? "A" : "B";
      d.choice_label = choice;
      d.chosen_image = d.response === 0 ? pair.A : pair.B;
      round3Choices[i] = choice;
      const answer = round3Answers[i];
      d.correct = (answer === "A" || answer === "B") ? (choice === answer ? 1 : 0) : null;
    }
  };
}
const positiveFeedback = {
  type: jsPsychHtmlKeyboardResponse,
  stimulus: `<div class="centered"><div class="feedback-banner">YOU ANSWERED THIS QUESTION CORRECT!</div><div class="press-space">Press space to continue.</div></div>`,
  choices: [' ']
};
const break2Screen = {
  type: jsPsychHtmlButtonResponse,
  stimulus: `<div class="centered"><p>Let's take a short break.</p><p><strong>Please tell us about your favorite teacher. What did they do that made them memorable?</strong></p><div class="break-box"><div style="flex:1;"><textarea id="writing" placeholder="Type here..."></textarea></div><div class="countdown" id="countdown2">2:00</div></div></div>`,
  choices: ['Submit'],
  button_html: '<button class="jspsych-btn" type="button" disabled>%choice%</button>',
  on_load: function() {
    const button = document.querySelector('.jspsych-html-button-response-button button');
    const countdown = document.getElementById('countdown2');
    let total = BREAK_SECONDS;
    countdown.textContent = `${Math.floor(total / 60)}:${String(total % 60).padStart(2, '0')}`;
    this._interval = setInterval(() => {
      total--;
      countdown.textContent = `${Math.floor(Math.max(total, 0) / 60)}:${String(Math.max(total, 0) % 60).padStart(2, '0')}`;
      if (total <= 0) { clearInterval(this._interval); button.disabled = false; }
    }, 1000);
  },
  on_finish: function(d) {
    if (this._interval) clearInterval(this._interval);
    const text = document.getElementById('writing');
    d.favorite_writing = text ? text.value : '';
  }
};
const round4Intro = {
  type: jsPsychHtmlKeyboardResponse,
  stimulus: `<div class="centered"><p>Based on what you learned in Round 3, answer the next four questions by selecting the image you picked earlier for each pair.</p><p style="text-align:center;"><strong>Press space to begin Round 4.</strong></p></div>`,
  choices: [' ']
};
function makeRound4Trial(i) {
  const pair = imagePairsRound3[i];
  return {
    type: jsPsychHtmlButtonResponse,
    stimulus: `<div class="centered"><div class="question-title">${round4Questions[i]}</div></div>`,
    choices: [imgChoice(pair.A, "A"), imgChoice(pair.B, "B")],
    data: { round: 4 },
    on_finish: d => {
      const choice = d.response === 0 ? "A" : "B";
      d.choice_label = choice;
      d.chosen_image = d.response === 0 ? pair.A : pair.B;
      d.correct = choice === round3Choices[i] ? 1 : 0;
      d.round3_choice_for_pair = round3Choices[i];
    }
  };
}

/**************** ROUNDS 1 AND 2 (SECOND) ****************/
const round1Intro = {
  type: jsPsychHtmlKeyboardResponse,
  stimulus: `<div class="centered"><p>Next, answer questions about a researcher-manufactured ancient script.</p><p>Whether you get the answers right or wrong in Round 1, try to learn. Round 2 will test how much you learned.</p><p style="text-align:center;"><strong>Press space to begin Round 1.</strong></p></div>`,
  choices: [' ']
};
function makeRound1Trial(i) {
  const pair = imagePairs[i];
  return {
    type: jsPsychHtmlButtonResponse,
    stimulus: `<div class="centered"><div class="question-title">${round1Questions[i].prompt}</div></div>`,
    choices: [imgChoice(pair.A, "A"), imgChoice(pair.B, "B")],
    data: { round: 1 },
    on_finish: d => {
      const choice = d.response === 0 ? "A" : "B";
      d.choice_label = choice;
      d.chosen_image = d.response === 0 ? pair.A : pair.B;
      round1Choices[i] = choice;
    }
  };
}
const incorrectFeedback = {
  type: jsPsychHtmlKeyboardResponse,
  stimulus: `<div class="centered"><div class="incorrect-banner">YOU ANSWERED THIS QUESTION INCORRECT!</div><div class="press-space">Press space to continue.</div></div>`,
  choices: [' ']
};
const breakScreen = {
  type: jsPsychHtmlButtonResponse,
  stimulus: `<div class="centered"><p>Take a short breather.</p><p><strong>What is your favorite music to listen to?</strong></p><div class="break-box"><div style="flex:1;"><textarea id="music" placeholder="Type here..."></textarea></div><div class="countdown" id="countdown">2:00</div></div></div>`,
  choices: ['Submit'],
  button_html: '<button class="jspsych-btn" type="button" disabled>%choice%</button>',
  on_load: function() {
    const button = document.querySelector('.jspsych-html-button-response-button button');
    const countdown = document.getElementById('countdown');
    let total = BREAK_SECONDS;
    countdown.textContent = `${Math.floor(total / 60)}:${String(total % 60).padStart(2, '0')}`;
    this._interval = setInterval(() => {
      total--;
      countdown.textContent = `${Math.floor(Math.max(total, 0) / 60)}:${String(Math.max(total, 0) % 60).padStart(2, '0')}`;
      if (total <= 0) { clearInterval(this._interval); button.disabled = false; }
    }, 1000);
  },
  on_finish: function(d) {
    if (this._interval) clearInterval(this._interval);
    const text = document.getElementById('music');
    d.favorite_music = text ? text.value : '';
  }
};
const round2Intro = {
  type: jsPsychHtmlKeyboardResponse,
  stimulus: `<div class="centered"><p><strong>This is Round 2.</strong></p><p>Based on what you learned about the researcher-manufactured ancient script in Round 1, answer the next four questions by selecting the appropriate image.</p><p style="text-align:center;"><strong>Press space bar to begin answering the questions.</strong></p></div>`,
  choices: [' ']
};
function makeRound2Trial(i) {
  const pair = imagePairs[i];
  return {
    type: jsPsychHtmlButtonResponse,
    stimulus: `<div class="centered"><div class="question-title">${round2Questions[i]}</div></div>`,
    choices: [imgChoice(pair.A, "A"), imgChoice(pair.B, "B")],
    data: { round: 2 },
    on_finish: d => {
      const choice = d.response === 0 ? "A" : "B";
      d.choice_label = choice;
      d.chosen_image = d.response === 0 ? pair.A : pair.B;
      d.round1_choice_for_pair = round1Choices[i];
      d.correct = choice === round1Choices[i] ? 1 : 0;
    }
  };
}

/**************** FINAL SCREEN ****************/
const finalScreen = {
  type: jsPsychHtmlButtonResponse,
  stimulus: `<div class="centered" style="text-align:center;"><p><strong>Thank you for your participation!</strong></p><p>Click continue to return to Qualtrics.</p></div>`,
  choices: ['Continue'],
  on_finish: function() {
    const payload = buildSummaryPayload();
    const params = new URLSearchParams(window.location.search);
    const query = new URLSearchParams({
      PROLIFIC_PID: params.get('PROLIFIC_PID') || '',
      STUDY_ID: params.get('STUDY_ID') || '',
      SESSION_ID: params.get('SESSION_ID') || '',
      version: VERSION,
      ...payload
    });
    window.location.href = `${QUALTRICS_RETURN_URL}?${query.toString()}`;
  }
};

/**************** REVERSED TIMELINE ****************/
const timeline = [intro1, intro2, comprehensionCheck, round3Intro];
for (let i = 0; i < 4; i++) {
  timeline.push(makeRound3Trial(i), positiveFeedback);
}
timeline.push(break2Screen, round4Intro);
for (let i = 0; i < 4; i++) timeline.push(makeRound4Trial(i));
timeline.push(round1Intro);
for (let i = 0; i < 4; i++) timeline.push(makeRound1Trial(i), incorrectFeedback);
timeline.push(breakScreen, round2Intro);
for (let i = 0; i < 4; i++) timeline.push(makeRound2Trial(i));
timeline.push(finalScreen);

jsPsych.run(timeline);
</script>
</body>
</html>

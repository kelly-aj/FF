<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Colors and Arrows</title>

  <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.0.2/jquery.min.js"></script>

  <!-- Squared task stylesheet -->
  <link href="squared.css" rel="stylesheet" type="text/css">

  <!-- Local jsPsych files.
       squared.html is in /squared, so ../jspsych points to /jspsych. -->
  <script src="../jspsych/jspsych.js"></script>
  <script src="../jspsych/plugin-call-function.js"></script>
  <script src="../jspsych/plugin-html-keyboard-response.js"></script>
  <script src="../jspsych/plugin-html-button-response.js"></script>
  <script src="../jspsych/plugin-fullscreen.js"></script>
  <script src="../jspsych/plugin-survey-text.js"></script>
  <script src="../jspsych/plugin-survey-multi-choice.js"></script>
  <script src="../jspsych/plugin-preload.js"></script>

  <link href="../jspsych/jspsych.css" rel="stylesheet" type="text/css">

    <style>
    /*
      Fill the iframe and allow jsPsych to use its full width.
    */
    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
    }

    #squared-root {
      width: 100%;
      min-height: 100vh;
    }

    .jspsych-display-element {
      width: 100% !important;
      min-height: 100vh;
    }

    .jspsych-content {
      width: 100% !important;
      max-width: none !important;
    }
  </style>
</head>

<body>
  <div id="squared-root"></div>

  <!-- This helper must be defined before squared.js runs. -->
  <script>
    (function installParentIntegration() {
      let hasPosted = false;

      window._postSquaredSummaryToParent = function(
        stroopSummary,
        flankerSummary,
        simonSummary,
        raw
      ) {
        if (hasPosted) {
          return;
        }

        hasPosted = true;

        const message = {
          type: "squared_done",
          stroopSummary: stroopSummary || {},
          flankerSummary: flankerSummary || {},
          simonSummary: simonSummary || {},
          raw: raw || null
        };

        console.log(
          "DEBUG(squared): posting completion message to parent",
          message
        );

        // The parent and iframe are same-origin on GitHub Pages.
        window.parent.postMessage(message, window.location.origin);
      };
    })();
  </script>

  <!-- Run the original squared implementation unchanged. -->
  <script src="squared.js"></script>

  <!-- Fallback completion watcher. The explicit call in squared.js is preferred. -->
  <script>
    (function watchForCompletion() {
      const POLL_MS = 500;
      const MAX_ATTEMPTS = 1200;
      let attempts = 0;
      let watcher;

      console.log("DEBUG(squared): completion watcher started");

      function getRows() {
        if (
          !window.jsPsych ||
          !window.jsPsych.data ||
          typeof window.jsPsych.data.get !== "function"
        ) {
          return [];
        }

        return window.jsPsych.data.get().values();
      }

      function getTaskRows(rows, taskName) {
        return rows.filter(function(row) {
          return (
            row.task === taskName &&
            Number(row.practice) === 0 &&
            row.timeout === 0
          );
        });
      }

      function meanRT(rows) {
        const values = rows
          .map(row => Number(row.rt))
          .filter(value => Number.isFinite(value));

        if (values.length === 0) {
          return "";
        }

        return values.reduce((sum, value) => sum + value, 0) / values.length;
      }

      watcher = setInterval(function() {
        attempts++;

        if (attempts >= MAX_ATTEMPTS) {
          clearInterval(watcher);
          console.warn("DEBUG(squared): completion watcher timed out");
          return;
        }

        const rows = getRows();

        const stroopRows = getTaskRows(rows, "stroop");
        const flankerRows = getTaskRows(rows, "flanker");
        const simonRows = getTaskRows(rows, "simon");

        /*
          The original experiment has all three task conclusions before
          the final conclusion. Require all three tasks before posting.
        */
        if (
          stroopRows.length === 0 ||
          flankerRows.length === 0 ||
          simonRows.length === 0
        ) {
          return;
        }

        const stroopLast = stroopRows[stroopRows.length - 1];
        const flankerLast = flankerRows[flankerRows.length - 1];
        const simonLast = simonRows[simonRows.length - 1];

        clearInterval(watcher);

        window._postSquaredSummaryToParent(
          {
            score_final: stroopLast.score_final ?? stroopLast.score_after_trial ?? "",
            meanrt_final: meanRT(stroopRows)
          },
          {
            score_final: flankerLast.score_final ?? flankerLast.score_after_trial ?? "",
            meanrt_final: meanRT(flankerRows)
          },
          {
            score_final: simonLast.score_final ?? simonLast.score_after_trial ?? "",
            meanrt_final: meanRT(simonRows)
          },
          null
        );
      }, POLL_MS);
    })();
  </script>
</body>
</html>

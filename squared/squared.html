<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Colors and Arrows (squared)</title>

  <!-- squared stylesheet -->
  <link href="squared.css" rel="stylesheet" type="text/css">

  <!-- jsPsych + UMD plugins (dist builds) -->
  <link href="https://unpkg.com/jspsych@7.3.1/dist/css/jspsych.css" rel="stylesheet" type="text/css">
  <script src="https://unpkg.com/jspsych@7.3.1/dist/jspsych.js"></script>

  <script src="https://unpkg.com/@jspsych/plugin-preload@1.1.2/dist/plugin-preload.js"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.1.2/dist/plugin-html-button-response.js"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.2/dist/plugin-html-keyboard-response.js"></script>
  <script src="https://unpkg.com/@jspsych/plugin-fullscreen@1.1.2/dist/plugin-fullscreen.js"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-text@1.1.2/dist/plugin-survey-text.js"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-multi-choice@1.1.2/dist/plugin-survey-multi-choice.js"></script>
  <script src="https://unpkg.com/@jspsych/plugin-call-function@1.1.2/dist/plugin-call-function.js"></script>

  <style>
    /* make the iframe content visible while debugging */
    html,body{height:100%;margin:0;padding:0;background:white;}
    #squared-root{min-height:100vh;background:transparent;}
    #__squared_debug { position:fixed; top:6px; right:6px; z-index:9999; background:#fff; color:#000; padding:6px 8px; border:1px solid #ccc; font-size:12px; opacity:0.9; }
  </style>
</head>
<body>
  <div id="squared-root"></div>
  <div id="__squared_debug">squared: waiting to load</div>

  <!-- Dynamically load squared.js only after jsPsych's init function is available (with shim) -->
  <script>
  (function loadSquaredWhenReady(){
    const DEBUG = true;
    function log(){ if(DEBUG) console.log.apply(console, arguments); }
    function showDebug(msg){ const el=document.getElementById('__squared_debug'); if(el) el.textContent = 'squared: ' + msg; }

    // Compatibility shim: provide initJsPsych if squared.js expects it
    // - If jsPsych.init exists, call it and return the jsPsych instance (best effort).
    // - Otherwise return the global jsPsych object if present.
    // This prevents squared.js from throwing when it calls initJsPsych.
    if (typeof window.initJsPsych !== 'function') {
      window.initJsPsych = function(initOptions) {
        try {
          if (window.jsPsych && typeof window.jsPsych.init === 'function') {
            log('initJsPsych shim: calling jsPsych.init with options', initOptions);
            // call jsPsych.init if it exists; many codebases expect initJsPsych to create the instance
            // jsPsych.init typically returns a Promise; return the global jsPsych for compatibility
            try {
              const res = window.jsPsych.init(initOptions);
              // If jsPsych.init returns a promise, keep it (some scripts expect initJsPsych to return instance)
              return res || window.jsPsych;
            } catch(e) {
              // some versions expect initJsPsych to be synchronous; fall back
              log('initJsPsych shim: jsPsych.init threw', e);
              return window.jsPsych;
            }
          } else if (window.jsPsych) {
            log('initJsPsych shim: returning existing jsPsych global');
            return window.jsPsych;
          } else {
            log('initJsPsych shim: jsPsych not ready yet, returning undefined');
            return undefined;
          }
        } catch (e) {
          console.warn('initJsPsych shim unexpected error', e);
          return undefined;
        }
      };
      log('initJsPsych shim installed');
    } else {
      log('initJsPsych already present, not overriding');
    }

    function injectSquaredScript(){
      if (document.getElementById('squared-loader')) return;
      const s = document.createElement('script');
      s.id = 'squared-loader';
      s.src = 'squared.js';
      s.onload = function(){ log('squared.js loaded'); showDebug('squared.js loaded'); };
      s.onerror = function(e){ console.error('Failed to load squared.js', e); showDebug('failed to load squared.js'); };
      document.body.appendChild(s);
      showDebug('squared.js injected');
    }

    // If initJsPsych already exists as a function, inject immediately
    if (typeof initJsPsych === 'function') {
      log('initJsPsych detected — injecting squared.js now');
      showDebug('initJsPsych ready');
      injectSquaredScript();
      return;
    }

    // Otherwise poll briefly for readiness
    let attempts = 0;
    const maxAttempts = 100; // ~5 seconds at 50ms intervals
    const pollInterval = 50;
    const intervalId = setInterval(function(){
      attempts++;
      if (typeof initJsPsych === 'function') {
        clearInterval(intervalId);
        log('Detected initJsPsych after', attempts, 'tries — injecting squared.js');
        showDebug('initJsPsych detected');
        injectSquaredScript();
        return;
      }
      if (attempts % 10 === 0) log('waiting for initJsPsych... attempt', attempts);
      if (attempts >= maxAttempts) {
        clearInterval(intervalId);
        console.warn('Timed out waiting for initJsPsych; injecting squared.js anyway (may error)');
        showDebug('timed out waiting for initJsPsych — injecting anyway');
        injectSquaredScript();
      }
    }, pollInterval);
  })();
  </script>

  <!-- Integration helper: posts summary to parent and polling fallback -->
  <script>
  function postSummaryToParent(stroopSummary, flankerSummary, simonSummary, raw) {
    const msg = {
      type: 'squared_done',
      stroopSummary: stroopSummary || {},
      flankerSummary: flankerSummary || {},
      simonSummary: simonSummary || {},
      raw: raw || null
    };
    try {
      window.parent.postMessage(msg, window.location.origin);
      console.log('DEBUG(squared): posted summary to parent (origin)', window.location.origin, msg);
    } catch (err) {
      window.parent.postMessage(msg, '*');
      console.warn('DEBUG(squared): posted summary to parent with wildcard origin (fallback)', err, msg);
    }
  }
  window._postSquaredSummaryToParent = postSummaryToParent;

  (function watchForCompletion() {
    const POLL_MS = 800;
    let attempts = 0; const MAX = 600;
    console.log('DEBUG(squared): starting completion watcher (dynamic loader + shim)');

    const timer = setInterval(() => {
      attempts++;
      if (attempts > MAX) { clearInterval(timer); console.warn('DEBUG(squared): polling timed out'); return; }
      const jp = window.jsPsych || null;
      if (!jp || typeof jp.data === 'undefined') return;
      try {
        const rows = jp.data.get().values();
        if (!rows || !Array.isArray(rows)) return;
        const findSummary = (task) => rows.filter(r => r.task === task && Number(r.practice) === 0 && (r.score_after_trial !== undefined || r.score_final !== undefined));
        const s = findSummary('stroop'), f = findSummary('flanker'), sm = findSummary('simon');
        if (s.length || f.length || sm.length) {
          function makeSummary(rows) {
            if (!rows || !rows.length) return { score_final:'', meanrt_final: '' };
            const last = rows[rows.length-1];
            let meanrt = '';
            try {
              const rts = rows.filter(r=> r.rt!==undefined && Number(r.timeout)!==1).map(r=>Number(r.rt)).filter(x=>!isNaN(x));
              if (rts.length) meanrt = rts.reduce((a,b)=>a+b,0)/rts.length;
            } catch(e){}
            return { score_final: last.score_after_trial || last.score_final || '', meanrt_final: meanrt };
          }
          clearInterval(timer);
          const sSummary = makeSummary(s), fSummary = makeSummary(f), smSummary = makeSummary(sm);
          console.log('DEBUG(squared): detected completion — posting summaries', {sSummary,fSummary,smSummary});
          postSummaryToParent(sSummary, fSummary, smSummary, null);
        }
      } catch (err) { console.warn('DEBUG(squared): polling error', err); }
    }, POLL_MS);
  })();
  </script>
</body>
</html>
